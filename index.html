<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <!-- Crema, no grafito: la app es edge-to-edge sin barra negra superior,
         así que el área de la barra de estado debe fundirse con el fondo. -->
    <meta name="theme-color" content="#F1F0EA" />

    <!-- Meta tags PWA: cuando el usuario hace "Agregar a Inicio" en iOS,
         la app abre en modo "standalone" (sin barra de URL de Safari, sin
         barra de asistente de formularios con chevrons, sin gestos de
         navegación). Se siente como una app nativa. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Método" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />

    <!-- PWA instalable: manifest + iconos. En Android da ícono real, splash
         y modo standalone; en iOS el apple-touch-icon cubre "Agregar a Inicio". -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <title>Entrena con Método</title>
    <script>
      // Opener SOLO en arranque frío: si la app ya se abrió en esta sesión
      // (volver del centro de Aprendizaje, botón "atrás", recarga por
      // actualización), se entra directo sin animación — verla en cada
      // regreso aburre y se siente como espera. sessionStorage muere al
      // cerrar la app de verdad, así que el próximo arranque real sí la ve.
      try { if (sessionStorage.getItem('mt:booted')) document.documentElement.classList.add('warm-start'); } catch (e) {}
      // Visual nueva (en prueba): mismo filtro que VISUAL_V2 en src/v2.js.
      // Si cambias la lista allá, cámbiala aquí también.
      try {
        var crudo = localStorage.getItem('mt:name') || '';
        try { crudo = JSON.parse(crudo); } catch (e) {}
        var n = String(crudo || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/\s+/g, ' ').trim();
        if (['mauro moron'].indexOf(n) !== -1) document.documentElement.classList.add('splash-v2');
        // La entrada nueva es negra: la barra del teléfono también, mientras dura.
        if (document.documentElement.classList.contains('splash-v2') && !document.documentElement.classList.contains('warm-start')) {
          var tc = document.querySelector('meta[name="theme-color"]'); if (tc) tc.setAttribute('content', '#0C0C0B');
          setTimeout(function(){ try { var t2 = document.querySelector('meta[name="theme-color"]'); if (t2 && !document.body.classList.contains('app-ready')) t2.setAttribute('content', '#F4F2EC'); } catch (e) {} }, 1600);
        }
      } catch (e) {}
    </script>
    <style>
      /* CSS inline crítico — splash de marca mientras React carga. Todo es
         SVG+CSS inline (cero requests extra), así aparece al instante.
         Recrea el logo real: M blanca + anillo de progreso verde que se
         llena + punto blanco en la cabeza del anillo + destello sobre la M.
         Secuencia ~1.4s + fade; main.jsx retiene el splash ~1.6s (ritmo de
         app premium: se alcanza a leer la marca sin sentir espera). */
      /* NADA de recursos externos aquí: una hoja de estilos remota bloquea
         el primer pintado y deja la app en blanco si la red falla. La app ya
         trae Bebas empaquetada (@fontsource en main.jsx) y el splash dura lo
         suficiente para que llegue; hasta entonces se usa la de reserva. */
      html, body { margin: 0; padding: 0; background: #EDECE5; font-family: -apple-system, system-ui, sans-serif; }
      #splash {
        position: fixed; inset: 0;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        background: #0C0C0B;
        z-index: 9999;
        transition: opacity 0.3s ease-out;
      }
      #splash .logo { width: 148px; height: 148px; }
      /* Anillo: se llena de 0 → ~92% en 0.85s (dasharray = 2πr, r=210) */
      #splash .ring {
        stroke-dasharray: 1131.0;
        stroke-dashoffset: 1131.0;
        animation: ringfill 1.0s cubic-bezier(0.3, 0, 0.2, 1) 0.15s forwards;
      }
      @keyframes ringfill { to { stroke-dashoffset: 90.5; } }
      /* Punto blanco: gira acompañando la cabeza del anillo (~331° = 92%) */
      #splash .head {
        transform-origin: 256px 256px;
        transform: rotate(0deg);
        animation: headspin 1.0s cubic-bezier(0.3, 0, 0.2, 1) 0.15s forwards;
      }
      @keyframes headspin { to { transform: rotate(331deg); } }
      /* Destello: un segmento de luz recorre el trazo de la M una vez */
      #splash .shine {
        stroke-dasharray: 90 520;
        stroke-dashoffset: 90;
        opacity: 0;
        animation: shinerun 0.6s ease-in-out 0.75s forwards;
      }
      @keyframes shinerun {
        0%   { opacity: 0; stroke-dashoffset: 90; }
        15%  { opacity: 0.95; }
        85%  { opacity: 0.95; }
        100% { opacity: 0; stroke-dashoffset: -520; }
      }
      #splash .sub {
        margin-top: 20px;
        /* Tipo de la marca. La fuente web puede no haber cargado todavía en
           un arranque frío, así que se declara la pila completa. */
        font-family: 'Bebas Neue', 'Oswald', 'Haettenschweiler', 'Arial Narrow', sans-serif;
        font-size: 26px; letter-spacing: 0.06em; text-transform: uppercase;
        color: #FFFFFF; font-weight: 400; line-height: 1;
        opacity: 0;
        animation: subfade 0.5s ease-out 0.55s forwards;
      }
      @keyframes subfade { to { opacity: 1; } }
      /* Oculta el splash una vez que React montó */
      body.app-ready #splash { opacity: 0; pointer-events: none; }
      /* Arranque caliente (misma sesión): sin opener, directo a la app */
      html.warm-start #splash { display: none; }
      /* ── Apertura de la visual nueva · «Las palabras» ───────────────────
         Fondo negro y letra enorme; las cuatro frases se apilan rápido, cada
         una en el color de su sección. Después sale de atrás un círculo
         claro que se agranda y vuelve todo claro; en el centro se dibuja la
         gráfica circular verde del programa, se llena, le salen los ojitos
         (estilo Headspace) y se convierte en la kettlebell que saluda.
           0.08–0.50 s  ENTRENA. · COME BIEN. · APRENDE. · CON MÉTODO.
           1.15–1.75 s  el círculo claro cubre la pantalla
           1.80–2.60 s  la gráfica circular se dibuja
           2.65–2.95 s  se llena: ya es el cuerpo
           2.95 s       los ojitos y la sonrisa
           3.30–3.70 s  el asa, las piernas y los brazos
           3.80–4.80 s  saluda
         La app espera a que termine (mínimo 5 s desde que se toca el ícono,
         ver main.jsx): nada se corta antes de verse. */
      @font-face { font-family: 'ECM Splash'; font-weight: 300 900; font-display: block;
        src: url('/fonts/figtree.woff2') format('woff2-variations'), url('/fonts/figtree.woff2') format('woff2'); }
      #splash2 { display: none; }
      html.splash-v2 #splash { display: none; }
      html.splash-v2 #splash2 {
        position: fixed; inset: 0; z-index: 9999; display: block; overflow: hidden; background: #0C0C0B;
        transition: opacity 0.45s ease-out;
      }
      body.app-ready #splash2 { opacity: 0; pointer-events: none; }
      html.warm-start #splash2 { display: none !important; }
      #splash2 .pila { position: absolute; left: 24px; right: 16px; top: calc(20vh + env(safe-area-inset-top, 0px)); margin: 0;
        font-family: 'ECM Splash', -apple-system, system-ui, sans-serif; font-weight: 900;
        font-size: min(11.4vw, 62px); line-height: 0.98; letter-spacing: -0.035em; color: #FFFFFF; }
      #splash2 .w { display: block; overflow: hidden; padding: 0.06em 0 0.04em; margin-top: -0.06em; }
      #splash2 .w > span { display: block; transform: translateY(135%); animation: s2entra .3s cubic-bezier(.2,.8,.2,1) forwards; }
      #splash2 .w1 > span { animation-delay: .08s; }
      #splash2 .w2 > span { color: #5BB273; animation-delay: .22s; }
      #splash2 .w3 > span { color: #F2964A; animation-delay: .36s; }
      #splash2 .w4 > span { animation-delay: .50s; }
      @keyframes s2entra { to { transform: translateY(0); } }
      /* El círculo claro que sale de atrás y cubre todo */
      #splash2 .claro { position: absolute; left: 50%; top: 50%; width: 10px; height: 10px; margin: -5px 0 0 -5px; border-radius: 50%;
        background: #F4F2EC; transform: scale(0); animation: s2claro .6s cubic-bezier(.65,0,.35,1) 1.15s forwards; }
      @keyframes s2claro { to { transform: scale(260); } }
      /* La marca, en el centro */
      #splash2 .marca { position: absolute; left: 50%; top: 50%; width: min(64vw, 280px); height: min(64vw, 280px);
        transform: translate(-50%, -54%); overflow: visible; }
      #splash2 .riel { opacity: 0; animation: s2in .25s ease-out 1.75s forwards; }
      #splash2 .arco { opacity: 0; stroke-dasharray: 100 100; stroke-dashoffset: 100; animation: s2in .01s linear 1.8s forwards, s2traza .8s cubic-bezier(.45,0,.25,1) 1.8s forwards, s2fuera .3s ease-out 2.7s forwards; }
      #splash2 .riel { animation: s2in .25s ease-out 1.75s forwards, s2fuera .3s ease-out 2.7s forwards; }
      #splash2 .cuerpo { opacity: 0; transform-box: fill-box; transform-origin: 50% 50%; animation: s2llena .32s cubic-bezier(.2,.9,.3,1.2) 2.65s forwards; }
      #splash2 .cara { opacity: 0; animation: s2in .25s ease-out 2.95s forwards; }
      #splash2 .asa { opacity: 0; stroke-dasharray: 100 100; stroke-dashoffset: 100; animation: s2in .01s linear 3.3s forwards, s2traza .4s ease-out 3.3s forwards; }
      #splash2 .resto { opacity: 0; animation: s2in .3s ease-out 3.4s forwards; }
      #splash2 .mano { transform-box: view-box; transform-origin: 45.6px 110.4px; animation: s2saluda .5s ease-in-out 3.8s 2; }
      @keyframes s2llena { from { opacity: 0; transform: scale(.85); } to { opacity: 1; transform: none; } }
      @keyframes s2saluda { 0%, 100% { transform: rotate(0); } 50% { transform: rotate(18deg); } }
      @keyframes s2traza { to { stroke-dashoffset: 0; } }
      @keyframes s2in { to { opacity: 1; } }
      @keyframes s2fuera { to { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) {
        #splash2 *, #splash2 .w > span { animation-duration: 0.01s !important; animation-delay: 0s !important; }
      }
      @media (prefers-reduced-motion: reduce) {
        #splash .ring { animation-duration: 0.01s; }
        #splash .head { animation-duration: 0.01s; }
        #splash .shine, #splash .sub { animation: none; opacity: 0; }
        #splash .sub { opacity: 1; }
      }
    </style>
  </head>
  <body>
    <div id="splash">
      <svg class="logo" viewBox="0 0 512 512" fill="none" aria-label="Entrena con Método">
        <defs>
          <linearGradient id="sp-ring" x1="140" y1="60" x2="420" y2="452" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#3A4126"/>
            <stop offset="0.55" stop-color="#8A9558"/>
            <stop offset="1" stop-color="#B9D454"/>
          </linearGradient>
        </defs>
        <!-- riel tenue del anillo -->
        <circle cx="256" cy="256" r="180" stroke="#232322" stroke-width="16"/>
        <!-- anillo de progreso que se llena (arranca arriba: rotado -90°) -->
        <circle class="ring" cx="256" cy="256" r="180" stroke="url(#sp-ring)"
                stroke-width="16" stroke-linecap="round" transform="rotate(-90 256 256)"/>
        <!-- punto blanco en la cabeza del anillo -->
        <g class="head"><circle cx="256" cy="76" r="17" fill="#F5F3EC"/></g>
        <!-- la M del logo -->
        <polyline points="194,305 194,196 267,282 314,203" stroke="#F5F3EC"
                  stroke-width="24" stroke-linecap="square" stroke-linejoin="miter"/>
        <!-- destello que recorre la M -->
        <polyline class="shine" points="194,305 194,196 267,282 314,203" stroke="#FFFFFF"
                  stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <div class="sub">Entrena con Método</div>
    </div>
    <div id="splash2" aria-label="Entrena con Método">
      <p class="pila"><span class="w w1"><span>ENTRENA.</span></span><span class="w w2"><span>COME BIEN.</span></span><span class="w w3"><span>APRENDE.</span></span><span class="w w4"><span>CON MÉTODO.</span></span></p>
      <div class="claro" aria-hidden="true"></div>
      <svg class="marca" viewBox="0 0 200 200" fill="none" aria-hidden="true">
        <g transform="translate(100 104) scale(1.6)">
          <!-- La gráfica circular del programa -->
          <circle class="riel" cx="0" cy="4" r="36" stroke="#1F1F1F" stroke-opacity="0.09" stroke-width="7"/>
          <path class="arco" d="M0 -32 A36 36 0 1 1 -0.01 -32" pathLength="100" stroke="#4FA463" stroke-width="7" stroke-linecap="round"/>
          <!-- …que se llena y se vuelve la kettlebell -->
          <g class="resto">
            <g stroke="#4FA463" stroke-width="6" stroke-linecap="round"><path d="M-11 31 L-14 43"/><path d="M11 31 L14 43"/></g>
            <ellipse cx="-17" cy="44.5" rx="6.5" ry="3" fill="#4FA463"/><ellipse cx="17" cy="44.5" rx="6.5" ry="3" fill="#4FA463"/>
            <path d="M33 10 Q45 14 41 25" stroke="#4FA463" stroke-width="6" stroke-linecap="round"/>
          </g>
          <path class="asa" d="M-25 -15C-32 -36 -24 -50 0 -50C24 -50 32 -36 25 -15" pathLength="100" stroke="#4FA463" stroke-width="11" stroke-linecap="round"/>
          <path class="cuerpo" d="M-22.6 32A36 36 0 1 1 22.6 32Z" fill="#4FA463"/>
          <g class="cara" stroke="#1F1F1F" stroke-width="2.7" stroke-linecap="round"><path d="M-14 1 Q-10 5.5 -6 1"/><path d="M6 1 Q10 5.5 14 1"/><path d="M-15 9 Q0 21 15 9"/></g>
          <g class="resto"><g class="mano"><path d="M-34 4 Q-48 -8 -50 -30" stroke="#4FA463" stroke-width="6" stroke-linecap="round"/><circle cx="-50" cy="-34" r="5" fill="#4FA463"/></g></g>
        </g>
      </svg>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
