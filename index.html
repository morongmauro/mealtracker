<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <!-- Crema, no grafito: la app es edge-to-edge sin barra negra superior,
         así que el área de la barra de estado debe fundirse con el fondo. -->
    <meta name="theme-color" content="#F1F0EA" />

    <!-- Meta tags PWA: cuando el usuario hace "Agregar a Inicio" en iOS,
         la app abre en modo "standalone" (sin barra de URL de Safari, sin
         barra de asistente de formularios con chevrons, sin gestos de
         navegación). Se siente como una app nativa. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Método" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />

    <!-- PWA instalable: manifest + iconos. En Android da ícono real, splash
         y modo standalone; en iOS el apple-touch-icon cubre "Agregar a Inicio". -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <title>Entrena con Método</title>
    <script>
      // Opener SOLO en arranque frío: si la app ya se abrió en esta sesión
      // (volver del centro de Aprendizaje, botón "atrás", recarga por
      // actualización), se entra directo sin animación — verla en cada
      // regreso aburre y se siente como espera. sessionStorage muere al
      // cerrar la app de verdad, así que el próximo arranque real sí la ve.
      try { if (sessionStorage.getItem('mt:booted')) document.documentElement.classList.add('warm-start'); } catch (e) {}
      // Visual nueva (en prueba): mismo filtro que VISUAL_V2 en src/v2.js.
      // Si cambias la lista allá, cámbiala aquí también.
      try {
        var crudo = localStorage.getItem('mt:name') || '';
        try { crudo = JSON.parse(crudo); } catch (e) {}
        var n = String(crudo || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/\s+/g, ' ').trim();
        if (['mauro moron'].indexOf(n) !== -1) document.documentElement.classList.add('splash-v2');
      } catch (e) {}
    </script>
    <style>
      /* CSS inline crítico — splash de marca mientras React carga. Todo es
         SVG+CSS inline (cero requests extra), así aparece al instante.
         Recrea el logo real: M blanca + anillo de progreso verde que se
         llena + punto blanco en la cabeza del anillo + destello sobre la M.
         Secuencia ~1.4s + fade; main.jsx retiene el splash ~1.6s (ritmo de
         app premium: se alcanza a leer la marca sin sentir espera). */
      /* NADA de recursos externos aquí: una hoja de estilos remota bloquea
         el primer pintado y deja la app en blanco si la red falla. La app ya
         trae Bebas empaquetada (@fontsource en main.jsx) y el splash dura lo
         suficiente para que llegue; hasta entonces se usa la de reserva. */
      html, body { margin: 0; padding: 0; background: #EDECE5; font-family: -apple-system, system-ui, sans-serif; }
      #splash {
        position: fixed; inset: 0;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        background: #0C0C0B;
        z-index: 9999;
        transition: opacity 0.3s ease-out;
      }
      #splash .logo { width: 148px; height: 148px; }
      /* Anillo: se llena de 0 → ~92% en 0.85s (dasharray = 2πr, r=210) */
      #splash .ring {
        stroke-dasharray: 1131.0;
        stroke-dashoffset: 1131.0;
        animation: ringfill 1.0s cubic-bezier(0.3, 0, 0.2, 1) 0.15s forwards;
      }
      @keyframes ringfill { to { stroke-dashoffset: 90.5; } }
      /* Punto blanco: gira acompañando la cabeza del anillo (~331° = 92%) */
      #splash .head {
        transform-origin: 256px 256px;
        transform: rotate(0deg);
        animation: headspin 1.0s cubic-bezier(0.3, 0, 0.2, 1) 0.15s forwards;
      }
      @keyframes headspin { to { transform: rotate(331deg); } }
      /* Destello: un segmento de luz recorre el trazo de la M una vez */
      #splash .shine {
        stroke-dasharray: 90 520;
        stroke-dashoffset: 90;
        opacity: 0;
        animation: shinerun 0.6s ease-in-out 0.75s forwards;
      }
      @keyframes shinerun {
        0%   { opacity: 0; stroke-dashoffset: 90; }
        15%  { opacity: 0.95; }
        85%  { opacity: 0.95; }
        100% { opacity: 0; stroke-dashoffset: -520; }
      }
      #splash .sub {
        margin-top: 20px;
        /* Tipo de la marca. La fuente web puede no haber cargado todavía en
           un arranque frío, así que se declara la pila completa. */
        font-family: 'Bebas Neue', 'Oswald', 'Haettenschweiler', 'Arial Narrow', sans-serif;
        font-size: 26px; letter-spacing: 0.06em; text-transform: uppercase;
        color: #FFFFFF; font-weight: 400; line-height: 1;
        opacity: 0;
        animation: subfade 0.5s ease-out 0.55s forwards;
      }
      @keyframes subfade { to { opacity: 1; } }
      /* Oculta el splash una vez que React montó */
      body.app-ready #splash { opacity: 0; pointer-events: none; }
      /* Arranque caliente (misma sesión): sin opener, directo a la app */
      html.warm-start #splash { display: none; }
      /* ── Apertura de la visual nueva ─────────────────────────────────
         Al estilo de las apps de referencia (Puntos, Headspace): la
         pantalla en el color del ícono (el degradado del azul del entreno al
         verde de la comida), así tocar el ícono y abrir la app se sienten una
         sola cosa. El logo en blanco, con el anillo grueso de los del Dash.
           0.10 s  aparece un punto blanco en el centro
           0.55 s  el punto sube a su sitio en el anillo
           0.80 s  el anillo se dibuja con el punto en la punta
           1.25 s  la M del logo se dibuja
           1.95 s  un brillo recorre la M
           2.15 s  el logo se hace chico a la izquierda y sale el nombre
           2.75 s  el lema
         Se queda quieto hasta que la app está lista (mínimo 3,6 s desde que
         se toca el ícono, ver main.jsx) y se desvanece. */
      @font-face { font-family: 'ECM Splash'; font-weight: 300 900; font-display: block;
        src: url('/fonts/figtree.woff2') format('woff2-variations'), url('/fonts/figtree.woff2') format('woff2'); }
      #splash2 { display: none; }
      html.splash-v2 #splash { display: none; }
      html.splash-v2 #splash2 {
        position: fixed; inset: 0; z-index: 9999; display: flex; flex-direction: column;
        align-items: center; justify-content: center; overflow: hidden;
        background: linear-gradient(135deg, #3C7BD6 0%, #3690AE 50%, #46965A 100%);
        transition: opacity 0.45s ease-out;
      }
      body.app-ready #splash2 { opacity: 0; pointer-events: none; }
      html.warm-start #splash2 { display: none !important; }
      #splash2 .fila { display: flex; align-items: center; transition: transform 0.45s cubic-bezier(.3,0,.2,1); }
      body.app-ready #splash2 .fila { transform: scale(1.05); }
      #splash2 .marca { width: 150px; height: 150px; flex: none; overflow: visible;
        animation: s2chica 0.65s cubic-bezier(.65,0,.25,1) 2.15s forwards; }
      @keyframes s2chica { to { width: 84px; height: 84px; } }
      #splash2 .riel { opacity: 0; animation: s2in 0.45s ease-out 0.7s forwards; }
      #splash2 .tramo1 { stroke-dasharray: 100 100; stroke-dashoffset: 100;
        animation: s2traza 0.5s cubic-bezier(.55,0,1,1) 0.8s forwards; }
      #splash2 .tramo2 { stroke-dasharray: 100 100; stroke-dashoffset: 100; opacity: 0;
        animation: s2traza2 0.5s cubic-bezier(0,0,.3,1) 1.3s forwards; }
      @keyframes s2traza { to { stroke-dashoffset: 0; } }
      @keyframes s2traza2 { 0% { opacity: 1; stroke-dashoffset: 100; } 100% { opacity: 1; stroke-dashoffset: 0; } }
      /* El punto: nace grande en el centro, sube a lo alto del anillo y
         luego gira con la punta del trazo (mismo ritmo que los dos tramos). */
      #splash2 .gira { transform-origin: 256px 256px;
        animation: s2gira 1s linear 0.8s forwards; }
      @keyframes s2gira {
        0% { transform: rotate(0deg); animation-timing-function: cubic-bezier(.55,0,1,1); }
        50% { transform: rotate(120deg); animation-timing-function: cubic-bezier(0,0,.3,1); }
        100% { transform: rotate(240deg); } }
      #splash2 .semilla { transform-box: fill-box; transform-origin: center; transform: translateY(172px) scale(0);
        animation: s2semilla 0.7s cubic-bezier(.3,0,.2,1) 0.1s forwards; }
      @keyframes s2semilla {
        0% { transform: translateY(172px) scale(0); fill: #FFFFFF; }
        40% { transform: translateY(172px) scale(5.5); fill: #FFFFFF; }
        62% { transform: translateY(172px) scale(5.5); fill: #FFFFFF; }
        100% { transform: translateY(0) scale(1); fill: #FFFFFF; } }
      #splash2 .gira .semilla { animation: s2semilla 0.7s cubic-bezier(.3,0,.2,1) 0.1s forwards, s2hueco 0.25s ease-out 0.85s forwards; }
      @keyframes s2hueco { to { fill: #4291B8; } }
      #splash2 .eme { stroke-dasharray: 100 100; stroke-dashoffset: 100; opacity: 0;
        animation: s2eme 0.7s cubic-bezier(.6,0,.25,1) 1.25s forwards; }
      @keyframes s2eme { 0% { opacity: 1; stroke-dashoffset: 100; } 100% { opacity: 1; stroke-dashoffset: 0; } }
      #splash2 .brillo { stroke-dasharray: 18 100; stroke-dashoffset: 18; opacity: 0;
        animation: s2brillo 0.6s ease-in-out 1.95s forwards; }
      @keyframes s2brillo { 0% { opacity: 0; stroke-dashoffset: 18; } 20% { opacity: 0.85; } 80% { opacity: 0.85; } 100% { opacity: 0; stroke-dashoffset: -100; } }
      #splash2 .palabra { max-width: 0; overflow: hidden; white-space: nowrap; opacity: 0;
        font-family: 'ECM Splash', -apple-system, system-ui, sans-serif; color: #FFFFFF; line-height: 1.02;
        animation: s2palabra 0.65s cubic-bezier(.65,0,.25,1) 2.15s forwards; }
      @keyframes s2palabra { to { max-width: 230px; opacity: 1; padding-left: 16px; } }
      #splash2 .palabra .p1 { font-size: 21px; font-weight: 600; color: rgba(255,255,255,0.82); letter-spacing: -0.01em; }
      #splash2 .palabra .p2 { font-size: 38px; font-weight: 800; letter-spacing: -0.025em; }
      #splash2 .lema { position: absolute; left: 0; right: 0; top: calc(50% + 70px); text-align: center;
        font-family: 'ECM Splash', -apple-system, system-ui, sans-serif; font-weight: 500;
        font-size: 14.5px; color: rgba(255,255,255,0.78); letter-spacing: 0.01em; opacity: 0; transform: translateY(6px);
        animation: s2lema 0.6s ease-out 2.75s forwards; }
      @keyframes s2lema { to { opacity: 1; transform: none; } }
      @keyframes s2in { to { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) {
        #splash2 *, #splash2 .marca { animation-duration: 0.01s !important; animation-delay: 0s !important; }
      }
      @media (prefers-reduced-motion: reduce) {
        #splash .ring { animation-duration: 0.01s; }
        #splash .head { animation-duration: 0.01s; }
        #splash .shine, #splash .sub { animation: none; opacity: 0; }
        #splash .sub { opacity: 1; }
      }
    </style>
  </head>
  <body>
    <div id="splash">
      <svg class="logo" viewBox="0 0 512 512" fill="none" aria-label="Entrena con Método">
        <defs>
          <linearGradient id="sp-ring" x1="140" y1="60" x2="420" y2="452" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#3A4126"/>
            <stop offset="0.55" stop-color="#8A9558"/>
            <stop offset="1" stop-color="#B9D454"/>
          </linearGradient>
        </defs>
        <!-- riel tenue del anillo -->
        <circle cx="256" cy="256" r="180" stroke="#232322" stroke-width="16"/>
        <!-- anillo de progreso que se llena (arranca arriba: rotado -90°) -->
        <circle class="ring" cx="256" cy="256" r="180" stroke="url(#sp-ring)"
                stroke-width="16" stroke-linecap="round" transform="rotate(-90 256 256)"/>
        <!-- punto blanco en la cabeza del anillo -->
        <g class="head"><circle cx="256" cy="76" r="17" fill="#F5F3EC"/></g>
        <!-- la M del logo -->
        <polyline points="194,305 194,196 267,282 314,203" stroke="#F5F3EC"
                  stroke-width="24" stroke-linecap="square" stroke-linejoin="miter"/>
        <!-- destello que recorre la M -->
        <polyline class="shine" points="194,305 194,196 267,282 314,203" stroke="#FFFFFF"
                  stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <div class="sub">Entrena con Método</div>
    </div>
    <div id="splash2" aria-label="Entrena con Método">
      <div class="fila">
        <svg class="marca" viewBox="0 0 512 512" fill="none" aria-hidden="true">
          
  <circle class="riel" cx="256" cy="256" r="172" stroke="#FFFFFF" stroke-opacity="0.24" stroke-width="42" fill="none"/>
          <path class="tramo1" d="M256 84 A172 172 0 0 1 404.96 342" stroke="#FFFFFF" stroke-width="42" stroke-linecap="round" fill="none" pathLength="100"/>
          <path class="tramo2" d="M404.96 342 A172 172 0 0 1 107.04 342" stroke="#FFFFFF" stroke-width="42" stroke-linecap="round" fill="none" pathLength="100"/>
          <polyline class="eme" points="194,305 194,196 267,282 314,203" pathLength="100" stroke="#FFFFFF"
                    stroke-width="24" stroke-linecap="square" stroke-linejoin="miter"/>
          <polyline class="brillo" points="194,305 194,196 267,282 314,203" pathLength="100" stroke="#BFE3F2"
                    stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
          <g class="gira"><circle class="semilla" cx="256" cy="84" r="14" fill="#FFFFFF"/></g>
        </svg>
        <div class="palabra"><div class="p1">Entrena con</div><div class="p2">Método</div></div>
      </div>
      <div class="lema">Tu progreso, con método</div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
