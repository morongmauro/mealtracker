         la app abre en modo "standalone" (sin barra de URL de Safari, sin

         navegación). Se siente como una app nativa. -->

    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- El nombre debajo del ícono: «EntrenaMétodo». Va escrito AQUÍ, no solo
         cambiado después con JavaScript: el iPhone lee este valor (y el del
         manifest) al instalar, y el cambio posterior no lo veía. -->
    <meta name="apple-mobile-web-app-title" content="EntrenaMétodo" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />

         en la nueva es manifest-v2.json desde el primer instante, sin cambiarlo

         no la tomaran como instalable). -->
    <link rel="manifest" href="/manifest-app.json" />

    <title>Entrena con Método</title>
    <link rel="preload" href="/fonts/figtree.woff2" as="font" type="font/woff2" crossorigin>
    <script>
      // El pase de «Instalar»: el navegador lo ofrece una sola vez y temprano;
      // se guarda para que el botón «Instalar la app» del Dash lo use.
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault(); window.__pwaPrompt = e;
        try { window.dispatchEvent(new Event('mt:instalable')); } catch (x) {}
      });
      window.addEventListener('appinstalled', function () {
        window.__pwaPrompt = null; window.__pwaInstalada = true;
        try { window.dispatchEvent(new Event('mt:instalada')); } catch (x) {}
      });
    </script>
    <script>
      // «Ver como cliente» (desde el CRM): se abre con ?ver_como=<pase>. En
      // ese modo la app corre con un almacén EN MEMORIA, así no toca ni lee
      // lo que este navegador tenga guardado de la cuenta propia, y en solo
      // lectura (src/verComo.js: nada se manda al servidor). El pase queda
      // en sessionStorage, solo para esta pestaña, y la dirección se limpia.
      (function () {
        try {
          var m = /[?&]ver_como=([^&]+)/.exec(location.search);
          if (m) { sessionStorage.setItem('mt:verComo', decodeURIComponent(m[1])); history.replaceState(null, '', location.pathname); }
          if (!sessionStorage.getItem('mt:verComo')) return;
          var mem = {};
          // Solo las marcas de la visual nueva pasan al almacén en memoria
          // (nada de la cuenta): sin ellas, fuera del dominio nuevo (las
          // pruebas) la app arrancaría con la visual vieja.
          try {
            ['mt:probarDireccionNueva', 'mt:v2'].forEach(function (k) { var v = window.localStorage.getItem(k); if (v !== null) mem[k] = v; });
          } catch (e) {}
          // «Ver como» es ver lo que ve el cliente: la visual nueva, que es
          // la de todos en la dirección nueva. Se fuerza aunque el coach
          // abra el pase en otro dominio o sin esas marcas en su navegador.
          mem['mt:probarDireccionNueva'] = '1';
          mem['mt:v2'] = '1';
          var st = {
            getItem: function (k) { return Object.prototype.hasOwnProperty.call(mem, k) ? mem[k] : null; },
            setItem: function (k, v) { mem[k] = String(v); },
            removeItem: function (k) { delete mem[k]; },
            clear: function () { mem = {}; },
            key: function (i) { return Object.keys(mem)[i] || null; },
          };
          Object.defineProperty(st, 'length', { get: function () { return Object.keys(mem).length; } });
          Object.defineProperty(window, 'localStorage', { value: st, configurable: true });
          document.documentElement.classList.add('ver-como');
        } catch (e) {}
      })();
    </script>
    <script>
      // Opener SOLO en arranque frío: si la app ya se abrió en esta sesión
      // (volver del centro de Aprendizaje, botón "atrás", recarga por
      // actualización), se entra directo sin animación — verla en cada
      // regreso aburre y se siente como espera. sessionStorage muere al
      // cerrar la app de verdad, así que el próximo arranque real sí la ve.
      try { if (sessionStorage.getItem('mt:booted')) document.documentElement.classList.add('warm-start'); } catch (e) {}
      // Visual nueva (en prueba): mismo filtro que VISUAL_V2 en src/v2.js.
      // Si cambias la lista allá, cámbiala aquí también.
      try {
        var crudo = localStorage.getItem('mt:name') || '';
        try { crudo = JSON.parse(crudo); } catch (e) {}
        var n = String(crudo || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/\s+/g, ' ').trim();
        // En la dirección nueva, la visual nueva es de todos (mudanza.js →
        // DOMINIO_NUEVO; mt:probarDireccionNueva, solo pruebas).
        var nueva = location.host === 'entrenaconmetodoapp.vercel.app' || localStorage.getItem('mt:probarDireccionNueva') === '1';
        if (nueva || ['mauro moron'].indexOf(n) !== -1) document.documentElement.classList.add('splash-v2');
        // Visual nueva en este teléfono (su nombre está en la lista, o se abrió
        // con ?v2=1 para instalarla antes de entrar): el nombre de la app en
        // la pantalla de inicio es «EntrenaMétodo», y al instalarla abre con
        // ?v2=1 (manifest-v2.json), así la pantalla de entrada nueva sale
        // aunque el teléfono aún no sepa quién es.
        var v2url = /[?&]v2=1\b/.test(location.search);
        if (v2url) { try { localStorage.setItem('mt:v2', '1'); } catch (e) {} }
        if (nueva || v2url || document.documentElement.classList.contains('splash-v2') || localStorage.getItem('mt:v2') === '1') {
          document.documentElement.classList.add('marca-v2');
          var tt = document.querySelector('meta[name="apple-mobile-web-app-title"]');
          if (tt) tt.setAttribute('content', 'EntrenaMétodo');
          var mf = document.querySelector('link[rel="manifest"]');
          // En la dirección nueva ya viene el manifest nuevo (vercel.json).
          if (mf && location.host !== 'entrenaconmetodoapp.vercel.app') mf.setAttribute('href', '/manifest-v2.json');
        }
        // La entrada sale SIEMPRE que la app se abre de verdad (cerrada y
        // vuelta a abrir). No sale en una recarga dentro de la misma sesión
        // (warm-start: volver de Aprendizaje, una actualización). Al volver
        // desde segundo plano (minimizada) sale si pasaron 2 h o más (main.jsx).
        var raiz = document.documentElement;
        // El tamaño de la PANTALLA (no de la vista): al abrir desde el ícono,
        // el iPhone agranda la vista un instante después; si el fondo se
        // midiera con la vista, «crecería» frente a los ojos.
        try {
          var lado = Math.max(screen.width || 0, screen.height || 0) || Math.max(innerWidth, innerHeight);
          raiz.style.setProperty('--pantalla', lado + 'px');
          // El mayor de los dos: hay teléfonos que reportan la pantalla más
          // baja que la vista real, y abajo quedaba una franja sin fondo.
          raiz.style.setProperty('--alto-pantalla', Math.max(screen.height || 0, innerHeight || 0, document.documentElement.clientHeight || 0) + 'px');
        } catch (e) {}
        if (raiz.classList.contains('splash-v2') && !raiz.classList.contains('warm-start')) {
          // La entrada arranca YA, sin esperar a la app: así nunca hay
          // pantalla vacía. La app se arma por debajo cuando el ícono ya está
          // dibujado (main.jsx), para no trabar la animación.
          raiz.classList.add('intro-completa', 'intro-anda');
          window.__introDesde = performance.now();
          var tc = document.querySelector('meta[name="theme-color"]');
          if (tc) tc.setAttribute('content', '#F3F1EB');
        }
      } catch (e) {}
    </script>
    <style>
      /* CSS inline crítico — splash de marca mientras React carga. Todo es
         SVG+CSS inline (cero requests extra), así aparece al instante.
         Recrea el logo real: M blanca + anillo de progreso verde que se
         llena + punto blanco en la cabeza del anillo + destello sobre la M.
         Secuencia ~1.4s + fade; main.jsx retiene el splash ~1.6s (ritmo de
         app premium: se alcanza a leer la marca sin sentir espera). */
      /* NADA de recursos externos aquí: una hoja de estilos remota bloquea
         el primer pintado y deja la app en blanco si la red falla. La app ya
         trae Bebas empaquetada (@fontsource en main.jsx) y el splash dura lo
         suficiente para que llegue; hasta entonces se usa la de reserva. */
      html, body { margin: 0; padding: 0; background: #EDECE5; font-family: -apple-system, system-ui, sans-serif; }
      /* Visual nueva: UN solo color de fondo en todo (html, body, la entrada, el
         manifest y la pantalla de arranque): cualquier franja que asome antes
         del primer cuadro es de este mismo tono y no se ve. */
      html.splash-v2, html.splash-v2 body { background: #F3F1EB; }
      #splash {
        position: fixed; inset: 0;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        background: #0C0C0B;
        z-index: 9999;
        transition: opacity 0.3s ease-out;
      }
      #splash .logo { width: 148px; height: 148px; }
      /* Anillo: se llena de 0 → ~92% en 0.85s (dasharray = 2πr, r=210) */
      #splash .ring {
        stroke-dasharray: 1131.0;
        stroke-dashoffset: 1131.0;
        animation: ringfill 1.0s cubic-bezier(0.3, 0, 0.2, 1) 0.15s forwards;
      }
      @keyframes ringfill { to { stroke-dashoffset: 90.5; } }
      /* Punto blanco: gira acompañando la cabeza del anillo (~331° = 92%) */
      #splash .head {
        transform-origin: 256px 256px;
        transform: rotate(0deg);
        animation: headspin 1.0s cubic-bezier(0.3, 0, 0.2, 1) 0.15s forwards;
      }
      @keyframes headspin { to { transform: rotate(331deg); } }
      /* Destello: un segmento de luz recorre el trazo de la M una vez */
      #splash .shine {
        stroke-dasharray: 90 520;
        stroke-dashoffset: 90;
        opacity: 0;
        animation: shinerun 0.6s ease-in-out 0.75s forwards;
      }
      @keyframes shinerun {
        0%   { opacity: 0; stroke-dashoffset: 90; }
        15%  { opacity: 0.95; }
        85%  { opacity: 0.95; }
        100% { opacity: 0; stroke-dashoffset: -520; }
      }
      #splash .sub {
        margin-top: 20px;
        /* Tipo de la marca. La fuente web puede no haber cargado todavía en
           un arranque frío, así que se declara la pila completa. */
        font-family: 'Bebas Neue', 'Oswald', 'Haettenschweiler', 'Arial Narrow', sans-serif;
        font-size: 26px; letter-spacing: 0.06em; text-transform: uppercase;
        color: #FFFFFF; font-weight: 400; line-height: 1;
        opacity: 0;
        animation: subfade 0.5s ease-out 0.55s forwards;
      }
      @keyframes subfade { to { opacity: 1; } }
      /* Oculta el splash una vez que React montó */
      body.app-ready #splash { opacity: 0; pointer-events: none; }
      /* Arranque caliente (misma sesión): sin opener, directo a la app */
      html.warm-start #splash { display: none; }
      /* ── Apertura de la visual nueva ─────────────────────────────────────
         Sale siempre que la app se abre (cerrada y vuelta a abrir) y al
         volver a ella desde segundo plano tras 2 h o más (ver main.jsx).
         Para que NO se trabe: mientras la app carga solo se ven el fondo y el
         riel del anillo; la secuencia arranca (html.intro-anda) cuando la app
         ya está armada debajo. Rápida, como la de cualquier app:
           0.05–0.75 s  la línea circular de progreso, gris oscuro, como las
                        del Dash, con el puntito en la punta, da la vuelta
           0.10–0.70 s  «Entrena con / Método.» en dos líneas
           0.75–1.10 s  se rellena con el círculo blanco
           1.05–1.40 s  sale el asa: la kettlebell (sin cara ni brazos)
           2.00 s       el fondo se desvanece y aparece la app
         El fondo cubre TODA la pantalla del teléfono, también la franja de
         abajo (en el iPhone «inset: 0» se quedaba corto y se veía la app), y
         se mide con la pantalla, no con la vista: al abrir desde el ícono el
         iPhone agranda la vista un instante después y el fondo «crecía».
         El color del arranque (manifest.json, background_color) es el mismo
         crema: antes era blanco y se veía una franja blanca abajo. */
      /* `optional`: si la letra no llegó a tiempo se usa la de reserva y NO se
         cambia a mitad de la animación (ese cambio se veía como un fallo en
         el texto). Viene precargada (link rel=preload), así que casi siempre
         está lista desde el primer cuadro. */
      @font-face { font-family: 'ECM Splash'; font-weight: 300 900; font-display: optional;
        src: url('/fonts/figtree.woff2') format('woff2-variations'), url('/fonts/figtree.woff2') format('woff2'); }
      #splash2 { display: none; }
      html.splash-v2 #splash { display: none; }
      /* Entrada con el ÍCONO de la app (visual nueva), como la haría Apple:
           0.00–1.25 s  cuatro manchas de la marca nacen juntas en el centro
                        como gotas de tinta, giran en espiral hacia afuera, se
                        cruzan y quedan respirando cada una en su esquina
           0.20–0.90 s  un disco de cristal aparece en el centro
           0.30–1.45 s  las líneas del ícono se dibujan solas, como una gráfica
                        que se llena (sin sombra mientras se dibujan: se
                        recalculaba en cada cuadro y trababa el dibujo):
                        primero el asa, después el cuerpo
           1.38 s       sale el punto amarillo
           1.60–2.70 s  el blob absorbe las manchas: vuelven al centro y se
                        apagan, el fondo queda liso y adentro del blob se
                        encienden los colores del ícono del homescreen
           1.90–3.25 s  «Entrena con / Método.» por líneas, despacio, como las
                        frases de los módulos, letra por letra; «Método.» en
                        amarillo
           1.8–2.9 s    el ícono y el nombre quedan a la vista
           2.9 s        todo crece, se desvanece y aparece la app
         Arranca apenas se abre (nunca pantalla vacía) y solo anima opacidad y
         movimiento, que el teléfono mueve aunque esté ocupado armando la app:
         nada de desenfoques animados, que eran lo que la «congelaba». */
      html.splash-v2 #splash2 { position: fixed; top: -60px; left: 0; right: 0; bottom: -200px; z-index: 9999; display: block;
        overflow: hidden; pointer-events: none; background: #F3F1EB; transition: opacity .6s cubic-bezier(.5,0,.75,0); }
      html.warm-start #splash2 { display: none !important; }
      html.warm-start.intro-repite #splash2 { display: block !important; }
      body.app-ready #splash2 { opacity: 0; }
      #splash2 .fondo { position: absolute; inset: 0; background: linear-gradient(180deg, #FAF9F6, #F3F1EB); }
      #splash2 .escena { position: absolute; left: 0; right: 0; top: 60px; height: calc(100vh + 200px); height: calc(var(--alto-pantalla, 100lvh) + 200px);
        --centro: calc(var(--alto-pantalla, 100lvh) * 0.46);
        transform-origin: 50% var(--centro, 46%);
        transition: transform .6s cubic-bezier(.5,0,.75,0); will-change: transform; }
      body.app-ready #splash2 .escena { transform: scale(1.6); }
      #splash2 .remolino { position: absolute; left: 50%; top: var(--centro, 46%); width: 0; height: 0; }
      #splash2 .m { position: absolute; width: 420px; height: 360px; margin: -180px 0 0 -210px; filter: blur(30px); opacity: 0; will-change: transform, opacity; }
      #splash2 .m1 { background: radial-gradient(closest-side, rgba(60,123,214,.46), rgba(60,123,214,0)); border-radius: 48% 52% 44% 56% / 55% 42% 58% 45%; --x: -150px; --y: -300px; --s: 1.25; }
      #splash2 .m2 { background: radial-gradient(closest-side, rgba(242,201,76,.52), rgba(242,201,76,0)); border-radius: 56% 44% 52% 48% / 46% 56% 44% 54%; --x: 160px; --y: -280px; --s: 1.15; }
      #splash2 .m3 { background: radial-gradient(closest-side, rgba(70,150,90,.42), rgba(70,150,90,0)); border-radius: 44% 56% 58% 42% / 52% 48% 52% 48%; --x: -160px; --y: 330px; --s: 1.25; }
      #splash2 .m4 { background: radial-gradient(closest-side, rgba(238,132,52,.4), rgba(238,132,52,0)); border-radius: 52% 48% 46% 54% / 44% 56% 46% 54%; --x: 165px; --y: 300px; --s: 1.15; }
      #splash2 .plano { position: absolute; inset: 0; background: #F3F1EB; opacity: 0; }
      /* El piso: en algunos iPhone la pantalla útil termina unos 50 px antes
         del borde y lo que hay debajo se corta con una línea recta (se veía
         como un rectángulo abajo). Aquí las manchas se funden al crema liso
         antes de llegar ahí, pegado al borde real de la vista (fixed), así
         la franja de abajo es la continuación del mismo color. */
      #splash2 .piso { position: fixed; left: 0; right: 0; bottom: 0; height: 190px; pointer-events: none;
        background: linear-gradient(180deg, rgba(243,241,235,0) 0%, rgba(243,241,235,.85) 55%, #F3F1EB 100%); }

      #splash2 .dentro i { position: absolute; width: 150px; height: 150px; border-radius: 50%; filter: blur(18px); }
      #splash2 .dentro .d1 { left: -40px; top: -40px; background: radial-gradient(closest-side, rgba(60,123,214,.5), rgba(60,123,214,0)); }
      #splash2 .dentro .d2 { right: -40px; top: -40px; background: radial-gradient(closest-side, rgba(242,201,76,.55), rgba(242,201,76,0)); }
      #splash2 .dentro .d3 { left: -40px; bottom: -40px; background: radial-gradient(closest-side, rgba(70,150,90,.46), rgba(70,150,90,0)); }
      #splash2 .dentro .d4 { right: -40px; bottom: -40px; background: radial-gradient(closest-side, rgba(238,132,52,.46), rgba(238,132,52,0)); }
      #splash2 .velo { position: absolute; inset: 0; opacity: 0; background: radial-gradient(70% 38% at 50% var(--centro, 46%), rgba(255,255,255,.92), rgba(255,255,255,0) 70%); }
      /* Detrás del ícono: el blob de la marca, un cuadrado de lados y
         esquinas curvos (superelipse) girado 12°, blanco y con sombra suave. */
      #splash2 .disco { position: absolute; left: 50%; top: var(--centro, 46%); width: 184px; height: 184px; margin: -92px 0 0 -92px; overflow: visible;
        filter: drop-shadow(0 22px 34px rgba(30,30,40,.14)) drop-shadow(0 3px 8px rgba(30,30,40,.05));
        opacity: 0; transform: rotate(-12deg) scale(.55); will-change: transform, opacity; }
      #splash2 .escena3d { position: absolute; left: 50%; top: var(--centro, 46%); width: 120px; height: 120px; margin: -60px 0 0 -60px; perspective: 500px; }
      #splash2 .marca { width: 120px; height: 120px; overflow: visible; opacity: 0; }
      #splash2 .traza { stroke-dasharray: 100 100; stroke-dashoffset: 100; }
      #splash2 .punto, #splash2 .halo { transform-box: fill-box; transform-origin: center; transform: scale(0); }
      #splash2 .halo { opacity: 0; }
      #splash2 .nombre { position: absolute; left: 0; right: 0; top: calc(var(--centro, 46%) + 112px); margin: 0; text-align: center;
        font-family: 'ECM Splash', -apple-system, system-ui, sans-serif; font-weight: 800; font-size: 40px; line-height: 1.04;
        letter-spacing: -0.035em; color: #1D1D1F; white-space: nowrap; }
      /* Cada línea entra entera, despacio (1,1 s), subiendo apenas: antes
         entraba letra por letra, y como coincide con el armado de la app por
         debajo, el teléfono congelaba las letras y las soltaba de golpe.
         Todo en grafito; el único acento es el punto, el mismo del ícono. */
      #splash2 .nombre .linea { display: block; opacity: 0; transform: translateY(8px); will-change: transform, opacity; }
      #splash2 .nombre .pto { display: inline-block; color: #EDB929; transform: scale(0); will-change: transform; }
      html.intro-anda #splash2 .remolino { animation: s2gira 2.6s cubic-bezier(.25,.6,.2,1) forwards; }
      /* Salen y, a los 1,6 s, el blob las absorbe: vuelven al centro
         encogiéndose y apagándose (solo transform y opacidad: sin animar el
         desenfoque, que trabaría el teléfono). */
      html.intro-anda #splash2 .m { animation: s2sale 1.25s cubic-bezier(.2,.75,.15,1) forwards, s2entra 1s cubic-bezier(.4,0,.2,1) 1.6s forwards; }
      html.intro-anda #splash2 .m2 { animation-delay: .07s, 1.66s; }
      html.intro-anda #splash2 .m3 { animation-delay: .14s, 1.72s; }
      html.intro-anda #splash2 .m4 { animation-delay: .21s, 1.78s; }
      /* El fondo queda liso (el mismo crema de la app) mientras entran. */
      html.intro-anda #splash2 .plano { animation: s2aparece .8s ease-out 1.8s forwards; }
      html.intro-anda #splash2 .velo { animation: s2aparece .6s ease-out .3s forwards, s2apaga .8s ease-out 1.8s forwards; }
      /* Y adentro del blob se encienden los colores del ícono. */
      html.intro-anda #splash2 .dentro { animation: s2aparece .9s ease-out 1.9s forwards; }
      html.intro-anda #splash2 .disco { animation: s2disco .7s cubic-bezier(.2,1.3,.3,1) .2s forwards; }
      html.intro-anda #splash2 .marca { animation: s2aparece .2s ease-out .3s forwards; }
      html.intro-anda #splash2 .t1 { animation: s2traza .6s cubic-bezier(.4,0,.2,1) .3s forwards; }
      html.intro-anda #splash2 .t2 { animation: s2traza .85s cubic-bezier(.4,0,.2,1) .6s forwards; }
      html.intro-anda #splash2 .punto { animation: s2pop .5s cubic-bezier(.3,1.9,.5,1) 1.38s forwards; }
      html.intro-anda #splash2 .halo { animation: s2halo .9s ease-out 1.4s forwards; }
      html.intro-anda #splash2 .nombre .l1 { animation: s2letra 1.1s cubic-bezier(.2,.7,.2,1) 1.9s forwards; }
      html.intro-anda #splash2 .nombre .l2 { animation: s2letra 1.1s cubic-bezier(.2,.7,.2,1) 2.15s forwards; }
      html.intro-anda #splash2 .nombre .pto { animation: s2pop2 .4s cubic-bezier(.3,1.9,.5,1) 2.95s forwards; }
      @keyframes s2gira { from { transform: rotate(-160deg); } to { transform: rotate(0deg); } }
      @keyframes s2sale { 0% { opacity: 0; transform: translate(0, 0) scale(.12); } 18% { opacity: 1; } 55% { transform: translate(calc(var(--x) * .7), calc(var(--y) * .7)) scale(calc(var(--s) * 1.08)); } 100% { opacity: 1; transform: translate(var(--x), var(--y)) scale(var(--s)); } }
      @keyframes s2respira { from { opacity: 1; transform: translate(var(--x), var(--y)) scale(var(--s)); } to { opacity: 1; transform: translate(var(--x), var(--y)) scale(calc(var(--s) * 1.08)); } }
      @keyframes s2aparece { to { opacity: 1; } }
      @keyframes s2apaga { to { opacity: 0; } }
      @keyframes s2entra { 0% { opacity: 1; transform: translate(var(--x), var(--y)) scale(var(--s)); } 70% { opacity: .85; } 100% { opacity: 0; transform: translate(calc(var(--x) * .1), calc(var(--y) * .1)) scale(.26); } }
      @keyframes s2disco { to { opacity: 1; transform: rotate(-12deg) scale(1); } }
      @keyframes s2traza { to { stroke-dashoffset: 0; } }
      @keyframes s2pop { to { transform: scale(1); } }
      @keyframes s2halo { 0% { transform: scale(.6); opacity: .7; } 100% { transform: scale(2.6); opacity: 0; } }
      @keyframes s2letra { to { opacity: 1; transform: none; } }
      @keyframes s2pop2 { to { opacity: 1; transform: scale(1); } }
      @media (prefers-reduced-motion: reduce) {
        #splash2 * { animation-duration: 0.01s !important; animation-delay: 0s !important; transition: none !important; }
      }
      @media (prefers-reduced-motion: reduce) {
        #splash .ring { animation-duration: 0.01s; }
        #splash .head { animation-duration: 0.01s; }
        #splash .shine, #splash .sub { animation: none; opacity: 0; }
        #splash .sub { opacity: 1; }
      }
    </style>
  </head>
  <body>
    <div id="splash">
      <svg class="logo" viewBox="0 0 512 512" fill="none" aria-label="Entrena con Método">
        <defs>
          <linearGradient id="sp-ring" x1="140" y1="60" x2="420" y2="452" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#3A4126"/>
            <stop offset="0.55" stop-color="#8A9558"/>
            <stop offset="1" stop-color="#B9D454"/>
          </linearGradient>
        </defs>
        <!-- riel tenue del anillo -->
        <circle cx="256" cy="256" r="180" stroke="#232322" stroke-width="16"/>
        <!-- anillo de progreso que se llena (arranca arriba: rotado -90°) -->
        <circle class="ring" cx="256" cy="256" r="180" stroke="url(#sp-ring)"
                stroke-width="16" stroke-linecap="round" transform="rotate(-90 256 256)"/>
        <!-- punto blanco en la cabeza del anillo -->
        <g class="head"><circle cx="256" cy="76" r="17" fill="#F5F3EC"/></g>
        <!-- la M del logo -->
        <polyline points="194,305 194,196 267,282 314,203" stroke="#F5F3EC"
                  stroke-width="24" stroke-linecap="square" stroke-linejoin="miter"/>
        <!-- destello que recorre la M -->
        <polyline class="shine" points="194,305 194,196 267,282 314,203" stroke="#FFFFFF"
                  stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <div class="sub">Entrena con Método</div>
    </div>
    <div id="splash2" aria-label="Entrena con Método">
      <div class="fondo"></div>
      <div class="plano"></div>
      <div class="escena">
        <div class="remolino"><div class="m m1"></div><div class="m m2"></div><div class="m m3"></div><div class="m m4"></div></div>
        <div class="velo"></div>
        <div class="piso"></div>
        <svg class="disco" viewBox="0 0 200 200" aria-hidden="true"><path fill="#FFFFFF" d="M200.0 100.0L199.8 127.7L199.2 139.8L198.2 149.1L196.8 156.9L195.0 163.6L192.7 169.4L190.0 174.6L186.9 179.2L183.3 183.3L179.2 186.9L174.6 190.0L169.4 192.7L163.6 195.0L156.9 196.8L149.1 198.2L139.8 199.2L127.7 199.8L100.0 200.0L72.3 199.8L60.2 199.2L50.9 198.2L43.1 196.8L36.4 195.0L30.6 192.7L25.4 190.0L20.8 186.9L16.7 183.3L13.1 179.2L10.0 174.6L7.3 169.4L5.0 163.6L3.2 156.9L1.8 149.1L0.8 139.8L0.2 127.7L0.0 100.0L0.2 72.3L0.8 60.2L1.8 50.9L3.2 43.1L5.0 36.4L7.3 30.6L10.0 25.4L13.1 20.8L16.7 16.7L20.8 13.1L25.4 10.0L30.6 7.3L36.4 5.0L43.1 3.2L50.9 1.8L60.2 0.8L72.3 0.2L100.0 0.0L127.7 0.2L139.8 0.8L149.1 1.8L156.9 3.2L163.6 5.0L169.4 7.3L174.6 10.0L179.2 13.1L183.3 16.7L186.9 20.8L190.0 25.4L192.7 30.6L195.0 36.4L196.8 43.1L198.2 50.9L199.2 60.2L199.8 72.3Z"/></svg>
        <div class="dentro" aria-hidden="true"><i class="d1"></i><i class="d2"></i><i class="d3"></i><i class="d4"></i></div>
        <!-- El ícono de la app: la línea de la gráfica es el cuerpo de la
             kettlebell, con el asa encima y el punto amarillo en la punta. -->
        <div class="escena3d"><svg class="marca" viewBox="0 0 512 512" fill="none" aria-hidden="true"><defs>
          <linearGradient id="s2t" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3B3A37"/><stop offset="1" stop-color="#1F1E1C"/></linearGradient>
</defs>
          <g transform="translate(256 262) scale(.9) translate(-256 -248)" fill="none" stroke="url(#s2t)" stroke-width="40" stroke-linecap="round">
            <path class="traza t1" pathLength="100" d="M128 162 C96 72 160 18 256 18 C352 18 416 72 384 162"/><path class="traza t2" pathLength="100" d="M256 164 A136 136 0 1 1 120 300"/></g>
          <g transform="translate(256 262) scale(.9) translate(-256 -248)">
            <circle class="halo" cx="120" cy="300" r="28.8" fill="#F2C94C"/>
            <circle class="punto" cx="120" cy="300" r="28.8" fill="#F2C94C"/></g></svg></div>
        <p class="nombre"><span class="linea l1">Entrena con</span><span class="linea metodo l2">Método<span class="pto">.</span></span></p>
      </div>
      <script>
        // La secuencia espera a que la app esté armada (main.jsx la arranca);
        // mientras, el reloj de las animaciones SVG queda en pausa. Si la app
        // tarda demasiado, arranca sola a los 2,5 s.
        (function () {
          window.__empezarIntro = function () {
            var r = document.documentElement;
            if (!r.classList.contains('intro-completa')) return 0;
            if (window.__introDesde) return window.__introDesde;
            var svg = document.querySelector('#splash2 .marca');
            try { svg.setCurrentTime(0); svg.unpauseAnimations(); } catch (e) {}
            r.classList.add('intro-anda');
            window.__introDesde = performance.now();
            return window.__introDesde;
          };
          // (Arranca sola desde el <head>; esto queda por si acaso.)
          if (document.documentElement.classList.contains('intro-completa')) window.__empezarIntro();
        })();
      </script>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
