<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <!-- Crema, no grafito: la app es edge-to-edge sin barra negra superior,
         así que el área de la barra de estado debe fundirse con el fondo. -->
    <meta name="theme-color" content="#F1F0EA" />

    <!-- Meta tags PWA: cuando el usuario hace "Agregar a Inicio" en iOS,
         la app abre en modo "standalone" (sin barra de URL de Safari, sin
         barra de asistente de formularios con chevrons, sin gestos de
         navegación). Se siente como una app nativa. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Método" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />

    <!-- PWA instalable: manifest + iconos. En Android da ícono real, splash
         y modo standalone; en iOS el apple-touch-icon cubre "Agregar a Inicio". -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <title>Entrena con Método</title>
    <script>
      // Opener SOLO en arranque frío: si la app ya se abrió en esta sesión
      // (volver del centro de Aprendizaje, botón "atrás", recarga por
      // actualización), se entra directo sin animación — verla en cada
      // regreso aburre y se siente como espera. sessionStorage muere al
      // cerrar la app de verdad, así que el próximo arranque real sí la ve.
      try { if (sessionStorage.getItem('mt:booted')) document.documentElement.classList.add('warm-start'); } catch (e) {}
      // Visual nueva (en prueba): mismo filtro que VISUAL_V2 en src/v2.js.
      // Si cambias la lista allá, cámbiala aquí también.
      try {
        var crudo = localStorage.getItem('mt:name') || '';
        try { crudo = JSON.parse(crudo); } catch (e) {}
        var n = String(crudo || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/\s+/g, ' ').trim();
        if (['mauro moron'].indexOf(n) !== -1) document.documentElement.classList.add('splash-v2');
      } catch (e) {}
    </script>
    <style>
      /* CSS inline crítico — splash de marca mientras React carga. Todo es
         SVG+CSS inline (cero requests extra), así aparece al instante.
         Recrea el logo real: M blanca + anillo de progreso verde que se
         llena + punto blanco en la cabeza del anillo + destello sobre la M.
         Secuencia ~1.4s + fade; main.jsx retiene el splash ~1.6s (ritmo de
         app premium: se alcanza a leer la marca sin sentir espera). */
      /* NADA de recursos externos aquí: una hoja de estilos remota bloquea
         el primer pintado y deja la app en blanco si la red falla. La app ya
         trae Bebas empaquetada (@fontsource en main.jsx) y el splash dura lo
         suficiente para que llegue; hasta entonces se usa la de reserva. */
      html, body { margin: 0; padding: 0; background: #EDECE5; font-family: -apple-system, system-ui, sans-serif; }
      #splash {
        position: fixed; inset: 0;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        background: #0C0C0B;
        z-index: 9999;
        transition: opacity 0.3s ease-out;
      }
      #splash .logo { width: 148px; height: 148px; }
      /* Anillo: se llena de 0 → ~92% en 0.85s (dasharray = 2πr, r=210) */
      #splash .ring {
        stroke-dasharray: 1131.0;
        stroke-dashoffset: 1131.0;
        animation: ringfill 1.0s cubic-bezier(0.3, 0, 0.2, 1) 0.15s forwards;
      }
      @keyframes ringfill { to { stroke-dashoffset: 90.5; } }
      /* Punto blanco: gira acompañando la cabeza del anillo (~331° = 92%) */
      #splash .head {
        transform-origin: 256px 256px;
        transform: rotate(0deg);
        animation: headspin 1.0s cubic-bezier(0.3, 0, 0.2, 1) 0.15s forwards;
      }
      @keyframes headspin { to { transform: rotate(331deg); } }
      /* Destello: un segmento de luz recorre el trazo de la M una vez */
      #splash .shine {
        stroke-dasharray: 90 520;
        stroke-dashoffset: 90;
        opacity: 0;
        animation: shinerun 0.6s ease-in-out 0.75s forwards;
      }
      @keyframes shinerun {
        0%   { opacity: 0; stroke-dashoffset: 90; }
        15%  { opacity: 0.95; }
        85%  { opacity: 0.95; }
        100% { opacity: 0; stroke-dashoffset: -520; }
      }
      #splash .sub {
        margin-top: 20px;
        /* Tipo de la marca. La fuente web puede no haber cargado todavía en
           un arranque frío, así que se declara la pila completa. */
        font-family: 'Bebas Neue', 'Oswald', 'Haettenschweiler', 'Arial Narrow', sans-serif;
        font-size: 26px; letter-spacing: 0.06em; text-transform: uppercase;
        color: #FFFFFF; font-weight: 400; line-height: 1;
        opacity: 0;
        animation: subfade 0.5s ease-out 0.55s forwards;
      }
      @keyframes subfade { to { opacity: 1; } }
      /* Oculta el splash una vez que React montó */
      body.app-ready #splash { opacity: 0; pointer-events: none; }
      /* Arranque caliente (misma sesión): sin opener, directo a la app */
      html.warm-start #splash { display: none; }
      /* ── Apertura de la visual nueva ─────────────────────────────────
         El LOGO REAL (la M que termina hacia arriba, como un check, y el
         anillo de progreso con su punto), en los colores de la app: el
         anillo va del azul del entreno al verde de la comida.
           0.0 s  aparece el riel y un halo suave que respira
           0.2 s  el anillo se llena hasta donde lo hace el logo, con el punto
                  en la punta
           0.6 s  la M se dibuja de un solo trazo
           1.5 s  un brillo recorre la M y el logo da un pulso
           1.6 s  el nombre sube desde detrás de una línea
           2.2 s  el lema
         Luego se queda quieto hasta que la app está lista (mínimo 3,4 s
         desde que se toca el ícono, ver main.jsx) y sale agrandándose. */
      @font-face { font-family: 'ECM Splash'; font-weight: 300 900; font-display: block;
        src: url('/fonts/figtree.woff2') format('woff2-variations'), url('/fonts/figtree.woff2') format('woff2'); }
      #splash2 { display: none; }
      html.splash-v2 #splash { display: none; }
      html.splash-v2 #splash2 {
        position: fixed; inset: 0; z-index: 9999; display: flex; flex-direction: column;
        align-items: center; justify-content: center; background: #F1F0EA; overflow: hidden;
        transition: opacity 0.5s ease-out;
      }
      body.app-ready #splash2 { opacity: 0; pointer-events: none; }
      html.warm-start #splash2 { display: none !important; }
      #splash2 .halo { position: absolute; width: 520px; height: 520px; border-radius: 50%; left: 50%; top: 50%;
        margin: -330px 0 0 -260px; opacity: 0;
        background: radial-gradient(closest-side, rgba(60,123,214,0.16), rgba(70,150,90,0.10) 55%, rgba(241,240,234,0) 100%);
        animation: s2halo 1.2s ease-out 0.05s forwards, s2respira 3.2s ease-in-out 1.25s infinite; }
      @keyframes s2halo { from { opacity: 0; transform: scale(0.6); } to { opacity: 1; transform: scale(1); } }
      @keyframes s2respira { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }
      #splash2 .contenido { position: relative; display: flex; flex-direction: column; align-items: center;
        transition: transform 0.5s cubic-bezier(.3,0,.2,1); }
      body.app-ready #splash2 .contenido { transform: scale(1.08); }
      #splash2 .marca { width: 132px; height: 132px; overflow: visible;
        animation: s2pulso 0.6s cubic-bezier(.3,0,.2,1) 1.5s both; }
      @keyframes s2pulso { 0% { transform: scale(1); } 40% { transform: scale(1.07); } 100% { transform: scale(1); } }
      #splash2 .riel { opacity: 0; animation: s2in 0.4s ease-out 0.05s forwards; }
      #splash2 .arco { stroke-dasharray: 100; stroke-dashoffset: 100;
        animation: s2arco 1.2s cubic-bezier(.65,0,.25,1) 0.2s forwards; }
      @keyframes s2arco { to { stroke-dashoffset: 33.3; } }
      #splash2 .punta { transform-origin: 256px 256px; opacity: 0;
        animation: s2punta 1.2s cubic-bezier(.65,0,.25,1) 0.2s forwards; }
      @keyframes s2punta { 0% { opacity: 1; transform: rotate(0deg); } 100% { opacity: 1; transform: rotate(240deg); } }
      #splash2 .eme { stroke-dasharray: 100; stroke-dashoffset: 100;
        animation: s2eme 0.8s cubic-bezier(.6,0,.25,1) 0.6s forwards; }
      @keyframes s2eme { to { stroke-dashoffset: 0; } }
      #splash2 .brillo { stroke-dasharray: 18 100; stroke-dashoffset: 18; opacity: 0;
        animation: s2brillo 0.65s ease-in-out 1.45s forwards; }
      @keyframes s2brillo { 0% { opacity: 0; stroke-dashoffset: 18; } 20% { opacity: 0.9; } 80% { opacity: 0.9; } 100% { opacity: 0; stroke-dashoffset: -100; } }
      #splash2 .nombre { margin-top: 26px; overflow: hidden; padding: 2px 4px 4px;
        font-family: 'ECM Splash', -apple-system, system-ui, sans-serif; font-weight: 800; font-size: 26px;
        color: #1F1F1F; line-height: 1.1; }
      #splash2 .nombre span { display: inline-block; transform: translateY(110%); letter-spacing: 0.12em;
        animation: s2nombre 0.75s cubic-bezier(.2,.8,.2,1) 1.6s forwards; }
      @keyframes s2nombre { to { transform: none; letter-spacing: -0.02em; } }
      #splash2 .linea { width: 0; height: 2px; border-radius: 2px; margin-top: 2px;
        background: linear-gradient(90deg, #3C7BD6, #46965A); animation: s2linea 0.6s cubic-bezier(.3,0,.2,1) 1.55s forwards; }
      @keyframes s2linea { to { width: 44px; } }
      #splash2 .lema { margin-top: 10px; font-family: 'ECM Splash', -apple-system, system-ui, sans-serif; font-weight: 500;
        font-size: 14.5px; color: #8A8778; letter-spacing: 0.01em; opacity: 0; transform: translateY(4px);
        animation: s2lema 0.6s ease-out 2.2s forwards; }
      @keyframes s2lema { to { opacity: 1; transform: none; } }
      @keyframes s2in { to { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) {
        #splash2 *, #splash2 .marca { animation-duration: 0.01s !important; animation-delay: 0s !important; animation-iteration-count: 1 !important; }
      }
      @media (prefers-reduced-motion: reduce) {
        #splash .ring { animation-duration: 0.01s; }
        #splash .head { animation-duration: 0.01s; }
        #splash .shine, #splash .sub { animation: none; opacity: 0; }
        #splash .sub { opacity: 1; }
      }
    </style>
  </head>
  <body>
    <div id="splash">
      <svg class="logo" viewBox="0 0 512 512" fill="none" aria-label="Entrena con Método">
        <defs>
          <linearGradient id="sp-ring" x1="140" y1="60" x2="420" y2="452" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#3A4126"/>
            <stop offset="0.55" stop-color="#8A9558"/>
            <stop offset="1" stop-color="#B9D454"/>
          </linearGradient>
        </defs>
        <!-- riel tenue del anillo -->
        <circle cx="256" cy="256" r="180" stroke="#232322" stroke-width="16"/>
        <!-- anillo de progreso que se llena (arranca arriba: rotado -90°) -->
        <circle class="ring" cx="256" cy="256" r="180" stroke="url(#sp-ring)"
                stroke-width="16" stroke-linecap="round" transform="rotate(-90 256 256)"/>
        <!-- punto blanco en la cabeza del anillo -->
        <g class="head"><circle cx="256" cy="76" r="17" fill="#F5F3EC"/></g>
        <!-- la M del logo -->
        <polyline points="185,313 185,186 270,286 325,194" stroke="#F5F3EC"
                  stroke-width="24" stroke-linecap="square" stroke-linejoin="miter"/>
        <!-- destello que recorre la M -->
        <polyline class="shine" points="185,313 185,186 270,286 325,194" stroke="#FFFFFF"
                  stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <div class="sub">Entrena con Método</div>
    </div>
    <div id="splash2" aria-label="Entrena con Método">
      <div class="halo"></div>
      <div class="contenido">
        <svg class="marca" viewBox="0 0 512 512" fill="none" aria-hidden="true">
          <defs>
            <linearGradient id="s2-arco" x1="300" y1="60" x2="120" y2="420" gradientUnits="userSpaceOnUse">
              <stop offset="0" stop-color="#3C7BD6"/>
              <stop offset="0.55" stop-color="#3F8FA6"/>
              <stop offset="1" stop-color="#46965A"/>
            </linearGradient>
          </defs>
          <circle class="riel" cx="256" cy="256" r="180" stroke="#E3DFD4" stroke-width="18"/>
          <circle class="arco" cx="256" cy="256" r="180" stroke="url(#s2-arco)" stroke-width="18" pathLength="100"
                  stroke-linecap="round" transform="rotate(-90 256 256)"/>
          <g class="punta"><circle cx="256" cy="76" r="19" fill="#FFFFFF" stroke="#46965A" stroke-width="3"/></g>
          <polyline class="eme" points="185,313 185,186 270,286 325,194" pathLength="100" stroke="#1F1F1F"
                    stroke-width="26" stroke-linecap="square" stroke-linejoin="miter"/>
          <polyline class="brillo" points="185,313 185,186 270,286 325,194" pathLength="100" stroke="#FFFFFF"
                    stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <div class="nombre"><span>Entrena con Método</span></div>
        <div class="linea"></div>
        <div class="lema">Tu progreso, con método</div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
