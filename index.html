    <meta charset="UTF-8" />

    <!-- Crema, no grafito: la app es edge-to-edge sin barra negra superior,
         así que el área de la barra de estado debe fundirse con el fondo. -->
    <meta name="theme-color" content="#F1F0EA" />

    <!-- Meta tags PWA: cuando el usuario hace "Agregar a Inicio" en iOS,
         la app abre en modo "standalone" (sin barra de URL de Safari, sin
         barra de asistente de formularios con chevrons, sin gestos de
         navegación). Se siente como una app nativa. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- El nombre debajo del ícono: «EntrenaMétodo». Va escrito AQUÍ, no solo
         cambiado después con JavaScript: el iPhone lee este valor (y el del
         manifest) al instalar, y el cambio posterior no lo veía. -->
    <meta name="apple-mobile-web-app-title" content="EntrenaMétodo" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />

    <!-- PWA instalable: manifest + iconos. En Android da ícono real, splash
         y modo standalone; en iOS el apple-touch-icon cubre "Agregar a Inicio". -->
    <!-- /manifest-app.json lo resuelve Vercel según la dirección (vercel.json):
         en la nueva es manifest-v2.json desde el primer instante, sin cambiarlo
         después con JavaScript (cambiarlo después hacía que algunos teléfonos
         no la tomaran como instalable). -->
    <link rel="manifest" href="/manifest-app.json" />
    <!-- Solo clara: Samsung Internet y Chrome tienen un «modo oscuro» que
         invierte las páginas web; la app tiene sus propios colores. -->
    <meta name="color-scheme" content="only light" />

    <title>Entrena con Método</title>
    <script>
      // El pase de «Instalar»: el navegador lo ofrece una sola vez y temprano;
      // se guarda para que el botón «Instalar la app» del Dash lo use.
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault(); window.__pwaPrompt = e;
        try { window.dispatchEvent(new Event('mt:instalable')); } catch (x) {}
      });
      window.addEventListener('appinstalled', function () {
        window.__pwaPrompt = null; window.__pwaInstalada = true;
        try { window.dispatchEvent(new Event('mt:instalada')); } catch (x) {}
      });
    </script>
    <script>
      // «Ver como cliente» (desde el CRM): se abre con ?ver_como=<pase>. En
      // ese modo la app corre con un almacén EN MEMORIA, así no toca ni lee
      // lo que este navegador tenga guardado de la cuenta propia, y en solo
      // lectura (src/verComo.js: nada se manda al servidor). El pase queda
      // en sessionStorage, solo para esta pestaña, y la dirección se limpia.
      (function () {
        try {
          var m = /[?&]ver_como=([^&]+)/.exec(location.search);
          if (m) { sessionStorage.setItem('mt:verComo', decodeURIComponent(m[1])); history.replaceState(null, '', location.pathname); }
          if (!sessionStorage.getItem('mt:verComo')) return;
          var mem = {};
          // Solo las marcas de la visual nueva pasan al almacén en memoria
          // (nada de la cuenta): sin ellas, fuera del dominio nuevo (las
          // pruebas) la app arrancaría con la visual vieja.
          try {
            ['mt:probarDireccionNueva', 'mt:v2'].forEach(function (k) { var v = window.localStorage.getItem(k); if (v !== null) mem[k] = v; });
          } catch (e) {}
          // «Ver como» es ver lo que ve el cliente: la visual nueva, que es
          // la de todos en la dirección nueva. Se fuerza aunque el coach
          // abra el pase en otro dominio o sin esas marcas en su navegador.
          mem['mt:probarDireccionNueva'] = '1';
          mem['mt:v2'] = '1';
          var st = {
            getItem: function (k) { return Object.prototype.hasOwnProperty.call(mem, k) ? mem[k] : null; },
            setItem: function (k, v) { mem[k] = String(v); },
            removeItem: function (k) { delete mem[k]; },
            clear: function () { mem = {}; },
            key: function (i) { return Object.keys(mem)[i] || null; },
          };
          Object.defineProperty(st, 'length', { get: function () { return Object.keys(mem).length; } });
          Object.defineProperty(window, 'localStorage', { value: st, configurable: true });
          document.documentElement.classList.add('ver-como');
        } catch (e) {}
      })();
    </script>
    <script>
      // Opener SOLO en arranque frío: si la app ya se abrió en esta sesión
      // (volver del centro de Aprendizaje, botón "atrás", recarga por
      // actualización), se entra directo sin animación — verla en cada
      // regreso aburre y se siente como espera. sessionStorage muere al
      // cerrar la app de verdad, así que el próximo arranque real sí la ve.
      try { if (sessionStorage.getItem('mt:booted')) document.documentElement.classList.add('warm-start'); } catch (e) {}
      // Visual nueva (en prueba): mismo filtro que VISUAL_V2 en src/v2.js.
      // Si cambias la lista allá, cámbiala aquí también.
      try {
        var crudo = localStorage.getItem('mt:name') || '';
        try { crudo = JSON.parse(crudo); } catch (e) {}
        var n = String(crudo || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/\s+/g, ' ').trim();
        // En la dirección nueva, la visual nueva es de todos (mudanza.js →
        // DOMINIO_NUEVO; mt:probarDireccionNueva, solo pruebas).
        var nueva = location.host === 'entrenaconmetodoapp.vercel.app' || localStorage.getItem('mt:probarDireccionNueva') === '1';
        if (nueva || ['mauro moron'].indexOf(n) !== -1) document.documentElement.classList.add('splash-v2');
        // La app nueva (src/vistaApp.js › PRUEBA_TODOS; antes solo la vista en
        // prueba): la entrada con el blob blanco y
        // los colores repartidos en sus esquinas, como los blobs de la app.
        try { var vp = JSON.parse(localStorage.getItem('mt:vistaApp') || 'null'); if ((document.documentElement.classList.contains('splash-v2') && localStorage.getItem('mt:pruebaTodos') !== '0') || (vp && (vp.modo === 'prueba' || vp.modo === 'compacta') && ['mauro moron', 'mauro moron2'].indexOf(n) !== -1)) document.documentElement.classList.add('intro-prueba'); if (document.documentElement.classList.contains('intro-prueba')) document.documentElement.classList.add('intro-l25'); } catch (e) {}
        // Visual nueva en este teléfono (su nombre está en la lista, o se abrió
        // con ?v2=1 para instalarla antes de entrar): el nombre de la app en
        // la pantalla de inicio es «EntrenaMétodo», y al instalarla abre con
        // ?v2=1 (manifest-v2.json), así la pantalla de entrada nueva sale
        // aunque el teléfono aún no sepa quién es.
        var v2url = /[?&]v2=1\b/.test(location.search);
        if (v2url) { try { localStorage.setItem('mt:v2', '1'); } catch (e) {} }
        if (nueva || v2url || document.documentElement.classList.contains('splash-v2') || localStorage.getItem('mt:v2') === '1') {
          document.documentElement.classList.add('marca-v2');
          var tt = document.querySelector('meta[name="apple-mobile-web-app-title"]');
          if (tt) tt.setAttribute('content', 'EntrenaMétodo');
          var mf = document.querySelector('link[rel="manifest"]');
          // En la dirección nueva ya viene el manifest nuevo (vercel.json).
          if (mf && location.host !== 'entrenaconmetodoapp.vercel.app') mf.setAttribute('href', '/manifest-v2.json');
        }
        // La entrada sale SIEMPRE que la app se abre de verdad (cerrada y
        // vuelta a abrir). No sale en una recarga dentro de la misma sesión
        // (warm-start: volver de Aprendizaje, una actualización). Al volver
        // desde segundo plano (minimizada) sale si pasaron 2 h o más (main.jsx).
        var raiz = document.documentElement;
        // El tamaño de la PANTALLA (no de la vista): al abrir desde el ícono,
        // el iPhone agranda la vista un instante después; si el fondo se
        // midiera con la vista, «crecería» frente a los ojos.
        try {
          var lado = Math.max(screen.width || 0, screen.height || 0) || Math.max(innerWidth, innerHeight);
          raiz.style.setProperty('--pantalla', lado + 'px');
          // El mayor de los dos: hay teléfonos que reportan la pantalla más
          // baja que la vista real, y abajo quedaba una franja sin fondo.
          raiz.style.setProperty('--alto-pantalla', Math.max(screen.height || 0, innerHeight || 0, document.documentElement.clientHeight || 0) + 'px');
        } catch (e) {}
        if (raiz.classList.contains('splash-v2') && !raiz.classList.contains('warm-start')) {
          // La entrada completa sale en la PRIMERA apertura del día; las
          // demás de ese día son cortas: la misma secuencia en ~1,8 s
          // (html.intro-corta; main.jsx hace lo mismo al volver tras 2 h).
          try {
            var dHoy = new Date(), diaHoy = dHoy.getFullYear() + '-' + (dHoy.getMonth() + 1) + '-' + dHoy.getDate();
            if (localStorage.getItem('mt:introDia') === diaHoy) raiz.classList.add('intro-corta');
            else localStorage.setItem('mt:introDia', diaHoy);
          } catch (e) {}
          // La entrada arranca YA, sin esperar a la app: así nunca hay
          // pantalla vacía. La app se arma por debajo cuando el ícono ya está
          // dibujado (main.jsx), para no trabar la animación.
          raiz.classList.add('intro-completa', 'intro-anda');
          window.__introDesde = performance.now();
          var tc = document.querySelector('meta[name="theme-color"]');
          if (tc) tc.setAttribute('content', '#F3F1EB');
        }
      } catch (e) {}
    </script>
    <style>
      /* CSS inline crítico — splash de marca mientras React carga. Todo es
         SVG+CSS inline (cero requests extra), así aparece al instante.
         Recrea el logo real: M blanca + anillo de progreso verde que se
         llena + punto blanco en la cabeza del anillo + destello sobre la M.
         Secuencia ~1.4s + fade; main.jsx retiene el splash ~1.6s (ritmo de
         app premium: se alcanza a leer la marca sin sentir espera). */
      /* NADA de recursos externos aquí: una hoja de estilos remota bloquea
         el primer pintado y deja la app en blanco si la red falla. La app ya
         trae Bebas empaquetada (@fontsource en main.jsx) y el splash dura lo
         suficiente para que llegue; hasta entonces se usa la de reserva. */
      html, body { margin: 0; padding: 0; background: #EDECE5; font-family: -apple-system, system-ui, sans-serif; }
      /* Los mismos ajustes de texto que luego trae la hoja de estilos de la app
         (Tailwind), puestos desde el primer cuadro: así, cuando llega, no
         cambia nada de lo que ya está en pantalla. */
      html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; font-feature-settings: normal; font-variation-settings: normal; }
      /* Visual nueva: UN solo color de fondo en todo (html, body, la entrada, el
         manifest y la pantalla de arranque): cualquier franja que asome antes
         del primer cuadro es de este mismo tono y no se ve. */
      html.splash-v2, html.splash-v2 body { background: #F3F1EB; }
      #splash {
        position: fixed; inset: 0;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        background: #0C0C0B;
        z-index: 9999;
        transition: opacity 0.3s ease-out;
      }
      #splash .logo { width: 148px; height: 148px; }
      /* Anillo: se llena de 0 → ~92% en 0.85s (dasharray = 2πr, r=210) */
      #splash .ring {
        stroke-dasharray: 1131.0;
        stroke-dashoffset: 1131.0;
        animation: ringfill 1.0s cubic-bezier(0.3, 0, 0.2, 1) 0.15s forwards;
      }
      @keyframes ringfill { to { stroke-dashoffset: 90.5; } }
      /* Punto blanco: gira acompañando la cabeza del anillo (~331° = 92%) */
      #splash .head {
        transform-origin: 256px 256px;
        transform: rotate(0deg);
        animation: headspin 1.0s cubic-bezier(0.3, 0, 0.2, 1) 0.15s forwards;
      }
      @keyframes headspin { to { transform: rotate(331deg); } }
      /* Destello: un segmento de luz recorre el trazo de la M una vez */
      #splash .shine {
        stroke-dasharray: 90 520;
        stroke-dashoffset: 90;
        opacity: 0;
        animation: shinerun 0.6s ease-in-out 0.75s forwards;
      }
      @keyframes shinerun {
        0%   { opacity: 0; stroke-dashoffset: 90; }
        15%  { opacity: 0.95; }
        85%  { opacity: 0.95; }
        100% { opacity: 0; stroke-dashoffset: -520; }
      }
      #splash .sub {
        margin-top: 20px;
        /* Tipo de la marca. La fuente web puede no haber cargado todavía en
           un arranque frío, así que se declara la pila completa. */
        font-family: 'Bebas Neue', 'Oswald', 'Haettenschweiler', 'Arial Narrow', sans-serif;
        font-size: 26px; letter-spacing: 0.06em; text-transform: uppercase;
        color: #FFFFFF; font-weight: 400; line-height: 1;
        opacity: 0;
        animation: subfade 0.5s ease-out 0.55s forwards;
      }
      @keyframes subfade { to { opacity: 1; } }
      /* Oculta el splash una vez que React montó */
      body.app-ready #splash { opacity: 0; pointer-events: none; }
      /* Arranque caliente (misma sesión): sin opener, directo a la app */
      html.warm-start #splash { display: none; }
      /* ── Apertura de la visual nueva ─────────────────────────────────────
         Sale siempre que la app se abre (cerrada y vuelta a abrir) y al
         volver a ella desde segundo plano tras 2 h o más (ver main.jsx).
         Para que NO se trabe: mientras la app carga solo se ven el fondo y el
         riel del anillo; la secuencia arranca (html.intro-anda) cuando la app
         ya está armada debajo. Rápida, como la de cualquier app:
           0.05–0.75 s  la línea circular de progreso, gris oscuro, como las
                        del Dash, con el puntito en la punta, da la vuelta
           0.10–0.70 s  «Entrena con / Método.» en dos líneas
           0.75–1.10 s  se rellena con el círculo blanco
           1.05–1.40 s  sale el asa: la kettlebell (sin cara ni brazos)
           2.00 s       el fondo se desvanece y aparece la app
         El fondo cubre TODA la pantalla del teléfono, también la franja de
         abajo (en el iPhone «inset: 0» se quedaba corto y se veía la app), y
         se mide con la pantalla, no con la vista: al abrir desde el ícono el
         iPhone agranda la vista un instante después y el fondo «crecía».
         El color del arranque (manifest.json, background_color) es el mismo
         crema: antes era blanco y se veía una franja blanca abajo. */
      #splash2 { display: none; }
      html.splash-v2 #splash { display: none; }
      /* Entrada con el ÍCONO de la app (visual nueva), como la haría Apple:
           0.00–1.10 s  cuatro manchas de la marca nacen juntas en el centro
                        y giran hasta quedar pegadas al ícono, como un halo
           0.12–0.72 s  el blob blanco aparece en el centro
           0.22–1.05 s  las líneas del ícono se dibujan solas, como una gráfica
                        que se llena: primero el asa, después el cuerpo
           1.00 s       sale el punto amarillo
           1.00–1.90 s  el blob absorbe las manchas: vuelven al centro y se
                        apagan, el fondo queda liso y adentro del blob se
                        encienden los colores del ícono del homescreen
           1.10–2.00 s  «Entrena con / Método.» por líneas, con su punto
           2.00–2.70 s  el ícono y el nombre quedan quietos, para leerlo
           2.70–3.20 s  crece apenas, se desvanece y aparece la app
         En total ~3,2 s (antes ~5,4). Si la app tarda más en armarse, la
         entrada espera quieta, ya completa.
         Arranca apenas se abre (nunca pantalla vacía) y solo anima opacidad y
         movimiento, que el teléfono mueve aunque esté ocupado armando la app:
         nada de desenfoques animados, que eran lo que la «congelaba». */
      /* will-change: opacity: la entrada vive en su propia capa desde el
         primer cuadro, así al desvanecerse al final nada se vuelve a dibujar
         (el texto se veía «en negrita» un instante justo ahí). */
      html.splash-v2 #splash2 { position: fixed; top: -60px; left: 0; right: 0; bottom: -200px; z-index: 9999; display: block; will-change: opacity; -webkit-font-smoothing: antialiased;
        overflow: hidden; pointer-events: none; background: #F3F1EB; transition: opacity .5s cubic-bezier(.4,0,.2,1); }
      html.warm-start #splash2 { display: none !important; }
      html.warm-start.intro-repite #splash2 { display: block !important; }
      body.app-ready #splash2 { opacity: 0; }
      /* Mientras la entrada tapa la pantalla, la app de abajo no se pinta: en
         el iPhone lo que lleva desenfoque de cristal (la barra de abajo) se
         asomaba por encima de la entrada un instante al final, como un
         rectángulo chico abajo que aparecía y se iba. Aparece recién cuando
         la entrada empieza a desvanecerse. */
      html.intro-completa body:not(.app-ready) #root { visibility: hidden; }
      #splash2 .fondo { position: absolute; inset: 0; background: linear-gradient(180deg, #FAF9F6, #F3F1EB); }
      #splash2 { --centro: calc(var(--alto-pantalla, 100lvh) * 0.46); }
      #splash2 .escena { position: absolute; left: 0; right: 0; top: 60px; height: calc(100vh + 200px); height: calc(var(--alto-pantalla, 100lvh) + 200px);
        transform-origin: 50% var(--centro, 46%);
        transition: transform .5s cubic-bezier(.4,0,.2,1); will-change: transform; }
      body.app-ready #splash2 .escena { transform: scale(1.18); }
      #splash2 .remolino { position: absolute; left: 50%; top: var(--centro, 46%); width: 0; height: 0; }
      /* Halo: las manchas nacen y se quedan pegadas al ícono, como un brillo,
         y el resto de la pantalla queda crema limpio (antes llenaban toda la
         pantalla, pálidas y con velo blanco: se veía como niebla lavada). */
      #splash2 .m { position: absolute; width: 250px; height: 220px; margin: -110px 0 0 -125px; filter: blur(26px); opacity: 0; will-change: transform, opacity; }
      #splash2 .m1 { background: radial-gradient(closest-side, rgba(60,123,214,.30), rgba(60,123,214,0)); border-radius: 48% 52% 44% 56% / 55% 42% 58% 45%; --x: -80px; --y: -78px; --s: 1.25; }
      #splash2 .m2 { background: radial-gradient(closest-side, rgba(242,201,76,.34), rgba(242,201,76,0)); border-radius: 56% 44% 52% 48% / 46% 56% 44% 54%; --x: 82px; --y: -74px; --s: 1.15; }
      #splash2 .m3 { background: radial-gradient(closest-side, rgba(70,150,90,.27), rgba(70,150,90,0)); border-radius: 44% 56% 58% 42% / 52% 48% 52% 48%; --x: -80px; --y: 82px; --s: 1.25; }
      #splash2 .m4 { background: radial-gradient(closest-side, rgba(238,132,52,.27), rgba(238,132,52,0)); border-radius: 52% 48% 46% 54% / 44% 56% 46% 54%; --x: 84px; --y: 80px; --s: 1.15; }
      #splash2 .plano { position: absolute; inset: 0; background: #F3F1EB; opacity: 0; }
      /* El piso: en algunos iPhone la pantalla útil termina unos 50 px antes
         del borde y lo que hay debajo se corta con una línea recta (se veía
         como un rectángulo abajo). Aquí las manchas se funden al crema liso
         antes de llegar ahí, pegado al borde real de la vista (fixed), así
         la franja de abajo es la continuación del mismo color. */
      #splash2 .piso { position: fixed; left: 0; right: 0; bottom: 0; height: 200px; pointer-events: none; z-index: 2;
        background: linear-gradient(180deg, rgba(243,241,235,0) 0%, rgba(243,241,235,.9) 50%, #F3F1EB 100%); }
      /* Los colores del ícono, dentro del blob: cuatro manchas chicas recortadas
         con la misma forma (y el mismo giro) del blob. Solo donde el recorte
         por trazado existe; si no, no se muestran y la entrada sigue igual. */
      #splash2 .dentro { display: none; }
      @supports (clip-path: path('M0 0L1 1Z')) {
        #splash2 .dentro { display: block; position: absolute; left: 50%; top: var(--centro, 46%); width: 184px; height: 184px; margin: -92px 0 0 -92px;

      <script>
        // La secuencia espera a que la app esté armada (main.jsx la arranca);
        // mientras, el reloj de las animaciones SVG queda en pausa. Si la app
        // tarda demasiado, arranca sola a los 2,5 s.
        (function () {
          window.__empezarIntro = function () {
            var r = document.documentElement;
            if (!r.classList.contains('intro-completa')) return 0;
            if (window.__introDesde) return window.__introDesde;
            var svg = document.querySelector('#splash2 .marca');
            try { svg.setCurrentTime(0); svg.unpauseAnimations(); } catch (e) {}
            r.classList.add('intro-anda');
            window.__introDesde = performance.now();
            return window.__introDesde;
          };
          // (Arranca sola desde el <head>; esto queda por si acaso.)
          if (document.documentElement.classList.contains('intro-completa')) window.__empezarIntro();
        })();
