<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <!-- Crema, no grafito: la app es edge-to-edge sin barra negra superior,
         así que el área de la barra de estado debe fundirse con el fondo. -->
    <meta name="theme-color" content="#F1F0EA" />

    <!-- Meta tags PWA: cuando el usuario hace "Agregar a Inicio" en iOS,
         la app abre en modo "standalone" (sin barra de URL de Safari, sin
         barra de asistente de formularios con chevrons, sin gestos de
         navegación). Se siente como una app nativa. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Método" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />

    <!-- PWA instalable: manifest + iconos. En Android da ícono real, splash
         y modo standalone; en iOS el apple-touch-icon cubre "Agregar a Inicio". -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <title>Entrena con Método</title>
    <script>
      // Opener SOLO en arranque frío: si la app ya se abrió en esta sesión
      // (volver del centro de Aprendizaje, botón "atrás", recarga por
      // actualización), se entra directo sin animación — verla en cada
      // regreso aburre y se siente como espera. sessionStorage muere al
      // cerrar la app de verdad, así que el próximo arranque real sí la ve.
      try { if (sessionStorage.getItem('mt:booted')) document.documentElement.classList.add('warm-start'); } catch (e) {}
      // Visual nueva (en prueba): mismo filtro que VISUAL_V2 en src/v2.js.
      // Si cambias la lista allá, cámbiala aquí también.
      try {
        var crudo = localStorage.getItem('mt:name') || '';
        try { crudo = JSON.parse(crudo); } catch (e) {}
        var n = String(crudo || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/\s+/g, ' ').trim();
        if (['mauro moron'].indexOf(n) !== -1) document.documentElement.classList.add('splash-v2');
        // Entrada COMPLETA solo la primera vez del día; el resto, la corta
        // (la kettlebell saluda y se va al Dash).
        var raiz = document.documentElement;
        if (raiz.classList.contains('splash-v2') && !raiz.classList.contains('warm-start')) {
          var d = new Date(), dia = d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate();
          var completa = true;
          try { completa = localStorage.getItem('mt:introDia') !== dia; localStorage.setItem('mt:introDia', dia); } catch (e) {}
          raiz.classList.add(completa ? 'intro-completa' : 'intro-corta');
          var tc = document.querySelector('meta[name="theme-color"]');
          if (tc) tc.setAttribute('content', '#EFECE5');
        }
      } catch (e) {}
    </script>
    <style>
      /* CSS inline crítico — splash de marca mientras React carga. Todo es
         SVG+CSS inline (cero requests extra), así aparece al instante.
         Recrea el logo real: M blanca + anillo de progreso verde que se
         llena + punto blanco en la cabeza del anillo + destello sobre la M.
         Secuencia ~1.4s + fade; main.jsx retiene el splash ~1.6s (ritmo de
         app premium: se alcanza a leer la marca sin sentir espera). */
      /* NADA de recursos externos aquí: una hoja de estilos remota bloquea
         el primer pintado y deja la app en blanco si la red falla. La app ya
         trae Bebas empaquetada (@fontsource en main.jsx) y el splash dura lo
         suficiente para que llegue; hasta entonces se usa la de reserva. */
      html, body { margin: 0; padding: 0; background: #EDECE5; font-family: -apple-system, system-ui, sans-serif; }
      #splash {
        position: fixed; inset: 0;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        background: #0C0C0B;
        z-index: 9999;
        transition: opacity 0.3s ease-out;
      }
      #splash .logo { width: 148px; height: 148px; }
      /* Anillo: se llena de 0 → ~92% en 0.85s (dasharray = 2πr, r=210) */
      #splash .ring {
        stroke-dasharray: 1131.0;
        stroke-dashoffset: 1131.0;
        animation: ringfill 1.0s cubic-bezier(0.3, 0, 0.2, 1) 0.15s forwards;
      }
      @keyframes ringfill { to { stroke-dashoffset: 90.5; } }
      /* Punto blanco: gira acompañando la cabeza del anillo (~331° = 92%) */
      #splash .head {
        transform-origin: 256px 256px;
        transform: rotate(0deg);
        animation: headspin 1.0s cubic-bezier(0.3, 0, 0.2, 1) 0.15s forwards;
      }
      @keyframes headspin { to { transform: rotate(331deg); } }
      /* Destello: un segmento de luz recorre el trazo de la M una vez */
      #splash .shine {
        stroke-dasharray: 90 520;
        stroke-dashoffset: 90;
        opacity: 0;
        animation: shinerun 0.6s ease-in-out 0.75s forwards;
      }
      @keyframes shinerun {
        0%   { opacity: 0; stroke-dashoffset: 90; }
        15%  { opacity: 0.95; }
        85%  { opacity: 0.95; }
        100% { opacity: 0; stroke-dashoffset: -520; }
      }
      #splash .sub {
        margin-top: 20px;
        /* Tipo de la marca. La fuente web puede no haber cargado todavía en
           un arranque frío, así que se declara la pila completa. */
        font-family: 'Bebas Neue', 'Oswald', 'Haettenschweiler', 'Arial Narrow', sans-serif;
        font-size: 26px; letter-spacing: 0.06em; text-transform: uppercase;
        color: #FFFFFF; font-weight: 400; line-height: 1;
        opacity: 0;
        animation: subfade 0.5s ease-out 0.55s forwards;
      }
      @keyframes subfade { to { opacity: 1; } }
      /* Oculta el splash una vez que React montó */
      body.app-ready #splash { opacity: 0; pointer-events: none; }
      /* Arranque caliente (misma sesión): sin opener, directo a la app */
      html.warm-start #splash { display: none; }
      /* ── Apertura de la visual nueva ─────────────────────────────────────
         Fondo con las manchas de la marca (los colores de los 4 módulos) y la
         kettlebell BLANCA, como en las cabeceras. Sin palabras.
         LARGA (la primera vez del día, ~2,7 s):
           0.15–0.60 s  aparece un círculo blanco
           0.55–1.25 s  alrededor se dibuja la gráfica circular del Dash,
                        un cuarto por módulo
           1.30–1.85 s  el anillo sube y queda en alto; el círculo ya es la
                        kettlebell: asa, piernas, cara y los brazos que suben
                        a sostener el anillo
           2.00–2.40 s  un saltito; debajo, «Entrena con Método»
         CORTA (~0,85 s: las demás aperturas del día y al volver a la app
         después de un rato minimizada, ver main.jsx): la kettlebell ya armada
         aparece, el anillo se dibuja rápido y da el saltito.
         CIERRE (las dos): cuando la app está lista, el fondo se desvanece y
         la kettlebell vuela a la cabecera del Dash (main.jsx calcula a dónde). */
      @font-face { font-family: 'ECM Splash'; font-weight: 300 900; font-display: block;
        src: url('/fonts/figtree.woff2') format('woff2-variations'), url('/fonts/figtree.woff2') format('woff2'); }
      #splash2 { display: none; }
      html.splash-v2 #splash { display: none; }
      html.splash-v2 #splash2 { position: fixed; inset: 0; z-index: 9999; display: block; overflow: hidden; pointer-events: none;
        transition: opacity .2s ease-out .45s; }
      html.warm-start #splash2 { display: none !important; }
      html.warm-start.intro-repite #splash2 { display: block !important; }
      body.app-ready #splash2 { opacity: 0; }
      /* El fondo: base clara y una mancha por módulo que se mece despacio */
      #splash2 .fondo { position: absolute; inset: 0; overflow: hidden; background: #EFECE5; transition: opacity .35s ease-out; }
      #splash2 .fondo i { position: absolute; width: 95vmax; height: 95vmax; border-radius: 50%; opacity: .9;
        animation: s2mece 6s ease-in-out infinite alternate; }
      #splash2 .fondo .m1 { left: -45vmax; top: -40vmax; background: radial-gradient(closest-side, #7FA6E3, rgba(127,166,227,0)); }
      #splash2 .fondo .m2 { right: -45vmax; top: -30vmax; background: radial-gradient(closest-side, #F0CD5C, rgba(240,205,92,0)); animation-delay: -2s; }
      #splash2 .fondo .m3 { left: -40vmax; bottom: -45vmax; background: radial-gradient(closest-side, #8CC79A, rgba(140,199,154,0)); animation-delay: -4s; }
      #splash2 .fondo .m4 { right: -42vmax; bottom: -42vmax; background: radial-gradient(closest-side, #F2A877, rgba(242,168,119,0)); animation-delay: -1s; }
      @keyframes s2mece { to { transform: translate3d(4vmax, 3vmax, 0) scale(1.06); } }
      body.app-ready #splash2 .fondo, body.app-ready #splash2 .nombre-caja { opacity: 0; transition: opacity .3s ease-out; }
      /* La kettlebell, en el centro */
      #splash2 .marca { position: absolute; left: 50%; top: 45%; width: min(76vw, 330px); height: min(76vw, 330px);
        margin: calc(min(76vw, 330px) / -2) 0 0 calc(min(76vw, 330px) / -2); overflow: visible;
        filter: drop-shadow(0 10px 26px rgba(40, 40, 30, .16));
        transition: transform .55s cubic-bezier(.65,0,.35,1), opacity .2s ease-out .4s; }
      body.app-ready #splash2 .marca { opacity: 0; }
      #splash2 .nombre-caja { position: absolute; left: 0; right: 0; top: calc(45% + min(31vw, 135px)); text-align: center; }
      #splash2 .nombre { display: inline-block; font-family: 'ECM Splash', -apple-system, system-ui, sans-serif; font-weight: 800;
        font-size: 22px; letter-spacing: -0.02em; color: #2B2A27; opacity: 0; }
      html.intro-completa #splash2 .nombre { animation: s2nombre .45s ease-out 2.0s forwards; }
      @keyframes s2nombre { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
      /* Piezas */
      #splash2 .cuerpo { transform-box: fill-box; transform-origin: 50% 50%; }
      #splash2 .anillo { transform-box: fill-box; transform-origin: 50% 50%; }
      #splash2 .cuarto { opacity: 0; stroke-dasharray: 100 100; stroke-dashoffset: 100; }
      #splash2 .riel { opacity: 0; }
      #splash2 .asa, #splash2 .brazo { stroke-dasharray: 100 100; stroke-dashoffset: 100; }
      #splash2 .piernas, #splash2 .cara, #splash2 .manos { opacity: 0; }
      #splash2 .salta { transform-box: view-box; }
      /* LARGA */
      html.intro-completa #splash2 .cuerpo { transform: scale(0); animation: s2pop .45s cubic-bezier(.3,1.5,.5,1) .15s forwards; }
      html.intro-completa #splash2 .riel { animation: s2in .3s ease-out .5s forwards; }
      html.intro-completa #splash2 .c1 { animation: s2in .01s linear .55s forwards, s2traza .24s cubic-bezier(.45,0,.25,1) .55s forwards; }
      html.intro-completa #splash2 .c2 { animation: s2in .01s linear .72s forwards, s2traza .24s cubic-bezier(.45,0,.25,1) .72s forwards; }
      html.intro-completa #splash2 .c3 { animation: s2in .01s linear .89s forwards, s2traza .24s cubic-bezier(.45,0,.25,1) .89s forwards; }
      html.intro-completa #splash2 .c4 { animation: s2in .01s linear 1.06s forwards, s2traza .24s cubic-bezier(.45,0,.25,1) 1.06s forwards; }
      html.intro-completa #splash2 .anillo { animation: s2alto .55s cubic-bezier(.65,0,.35,1) 1.3s forwards; }
      html.intro-completa #splash2 .asa { animation: s2traza .3s ease-out 1.45s forwards; }
      html.intro-completa #splash2 .piernas { animation: s2in .25s ease-out 1.45s forwards; }
      html.intro-completa #splash2 .brazo { animation: s2traza .3s ease-out 1.6s forwards; }
      html.intro-completa #splash2 .manos { animation: s2in .15s ease-out 1.8s forwards; }
      html.intro-completa #splash2 .cara { animation: s2in .25s ease-out 1.75s forwards; }
      html.intro-completa #splash2 .salta { animation: s2salta .45s cubic-bezier(.45,0,.55,1) 2.0s 1; }
      /* CORTA: ya armada; el anillo se dibuja rápido */
      html.intro-corta #splash2 .kb { transform-box: fill-box; transform-origin: 50% 80%; animation: s2pop .3s cubic-bezier(.3,1.5,.5,1) both; }
      html.intro-corta #splash2 .anillo { transform: translate(0, -78px) scale(.5); }
      html.intro-corta #splash2 .riel, html.intro-corta #splash2 .piernas, html.intro-corta #splash2 .cara, html.intro-corta #splash2 .manos { opacity: 1; }
      html.intro-corta #splash2 .asa, html.intro-corta #splash2 .brazo { stroke-dashoffset: 0; }
      html.intro-corta #splash2 .c1 { animation: s2in .01s linear .08s forwards, s2traza .16s ease-out .08s forwards; }
      html.intro-corta #splash2 .c2 { animation: s2in .01s linear .18s forwards, s2traza .16s ease-out .18s forwards; }
      html.intro-corta #splash2 .c3 { animation: s2in .01s linear .28s forwards, s2traza .16s ease-out .28s forwards; }
      html.intro-corta #splash2 .c4 { animation: s2in .01s linear .38s forwards, s2traza .16s ease-out .38s forwards; }
      html.intro-corta #splash2 .salta { animation: s2salta .4s cubic-bezier(.45,0,.55,1) .42s 1; }
      @keyframes s2pop { from { transform: scale(0); opacity: 0; } to { transform: scale(1); opacity: 1; } }
      @keyframes s2alto { to { transform: translate(0, -78px) scale(.5); } }
      @keyframes s2salta { 0%, 100% { transform: translateY(0); } 45% { transform: translateY(-9px); } }
      @keyframes s2traza { to { stroke-dashoffset: 0; } }
      @keyframes s2in { to { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) {
        #splash2 *, #splash2 .fondo i { animation-duration: 0.01s !important; animation-delay: 0s !important; transition: none !important; }
      }
      @media (prefers-reduced-motion: reduce) {
        #splash .ring { animation-duration: 0.01s; }
        #splash .head { animation-duration: 0.01s; }
        #splash .shine, #splash .sub { animation: none; opacity: 0; }
        #splash .sub { opacity: 1; }
      }
    </style>
  </head>
  <body>
    <div id="splash">
      <svg class="logo" viewBox="0 0 512 512" fill="none" aria-label="Entrena con Método">
        <defs>
          <linearGradient id="sp-ring" x1="140" y1="60" x2="420" y2="452" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#3A4126"/>
            <stop offset="0.55" stop-color="#8A9558"/>
            <stop offset="1" stop-color="#B9D454"/>
          </linearGradient>
        </defs>
        <!-- riel tenue del anillo -->
        <circle cx="256" cy="256" r="180" stroke="#232322" stroke-width="16"/>
        <!-- anillo de progreso que se llena (arranca arriba: rotado -90°) -->
        <circle class="ring" cx="256" cy="256" r="180" stroke="url(#sp-ring)"
                stroke-width="16" stroke-linecap="round" transform="rotate(-90 256 256)"/>
        <!-- punto blanco en la cabeza del anillo -->
        <g class="head"><circle cx="256" cy="76" r="17" fill="#F5F3EC"/></g>
        <!-- la M del logo -->
        <polyline points="194,305 194,196 267,282 314,203" stroke="#F5F3EC"
                  stroke-width="24" stroke-linecap="square" stroke-linejoin="miter"/>
        <!-- destello que recorre la M -->
        <polyline class="shine" points="194,305 194,196 267,282 314,203" stroke="#FFFFFF"
                  stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <div class="sub">Entrena con Método</div>
    </div>
    <div id="splash2" aria-label="Entrena con Método">
      <div class="fondo"><i class="m1"></i><i class="m2"></i><i class="m3"></i><i class="m4"></i></div>
      <svg class="marca" viewBox="-100 -110 200 200" fill="none" aria-hidden="true">
        <g class="kb"><g class="salta">
          <g class="piernas">
            <g stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"><path d="M-11 31 L-14 43"/><path d="M11 31 L14 43"/></g>
            <ellipse cx="-17" cy="44.5" rx="6.5" ry="3" fill="#FFFFFF"/><ellipse cx="17" cy="44.5" rx="6.5" ry="3" fill="#FFFFFF"/>
          </g>
          <path class="asa" d="M-21 -17C-27 -36 -20 -49 0 -49C20 -49 27 -36 21 -17" pathLength="100" stroke="#FFFFFF" stroke-width="11" stroke-linecap="round"/>
          <path class="cuerpo" d="M-22.6 32A36 36 0 1 1 22.6 32Z" fill="#FFFFFF"/>
          <g class="cara" stroke="#2B2A27" stroke-width="2.7" stroke-linecap="round"><path d="M-11 -4 Q-7 0.5 -3 -4"/><path d="M3 -4 Q7 0.5 11 -4"/><path d="M-15 4 Q0 16 15 4"/></g>
          <path class="brazo" d="M-35 2 Q-60 -22 -24 -66" pathLength="100" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>
          <path class="brazo" d="M35 2 Q60 -22 24 -66" pathLength="100" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>
          <!-- La gráfica circular del Dash: nace alrededor del círculo y sube -->
          <g class="anillo">
            <circle class="riel" cx="0" cy="4" r="47" stroke="#FFFFFF" stroke-opacity="0.6" stroke-width="16"/>
            <path class="cuarto c1" d="M4.9 -42.7 A47 47 0 0 1 46.7 -0.9" pathLength="100" stroke="#2F6CC4" stroke-width="10" stroke-linecap="round"/>
            <path class="cuarto c2" d="M46.7 8.9 A47 47 0 0 1 4.9 50.7" pathLength="100" stroke="#46965A" stroke-width="10" stroke-linecap="round"/>
            <path class="cuarto c3" d="M-4.9 50.7 A47 47 0 0 1 -46.7 8.9" pathLength="100" stroke="#D9732E" stroke-width="10" stroke-linecap="round"/>
            <path class="cuarto c4" d="M-46.7 -0.9 A47 47 0 0 1 -4.9 -42.7" pathLength="100" stroke="#E8B931" stroke-width="10" stroke-linecap="round"/>
          </g>
          <g class="manos" fill="#FFFFFF"><circle cx="-24" cy="-66" r="5"/><circle cx="24" cy="-66" r="5"/></g>
        </g></g>
      </svg>
      <div class="nombre-caja"><div class="nombre">Entrena con Método</div></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
