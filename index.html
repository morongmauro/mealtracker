<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <!-- Crema, no grafito: la app es edge-to-edge sin barra negra superior,
         así que el área de la barra de estado debe fundirse con el fondo. -->
    <meta name="theme-color" content="#F1F0EA" />

    <!-- Meta tags PWA: cuando el usuario hace "Agregar a Inicio" en iOS,
         la app abre en modo "standalone" (sin barra de URL de Safari, sin
         barra de asistente de formularios con chevrons, sin gestos de
         navegación). Se siente como una app nativa. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Método" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />

    <!-- PWA instalable: manifest + iconos. En Android da ícono real, splash
         y modo standalone; en iOS el apple-touch-icon cubre "Agregar a Inicio". -->
    <link rel="manifest" href="/manifest.json" />
    <!-- Pantalla de arranque del iPhone: el primer cuadro de la entrada (fondo
         de manchas + riel del anillo). Sin esto iOS arranca en BLANCO y esa
         franja blanca se veía abajo mientras la app terminaba de ocupar la
         pantalla. iOS la toma al agregar la app a la pantalla de inicio. -->
    <link rel="apple-touch-startup-image" media="(device-width: 440px) and (device-height: 956px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/arranque/arranque-1320x2868.jpg" />
    <link rel="apple-touch-startup-image" media="(device-width: 402px) and (device-height: 874px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/arranque/arranque-1206x2622.jpg" />
    <link rel="apple-touch-startup-image" media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/arranque/arranque-1290x2796.jpg" />
    <link rel="apple-touch-startup-image" media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/arranque/arranque-1179x2556.jpg" />
    <link rel="apple-touch-startup-image" media="(device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/arranque/arranque-1284x2778.jpg" />
    <link rel="apple-touch-startup-image" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/arranque/arranque-1170x2532.jpg" />
    <link rel="apple-touch-startup-image" media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/arranque/arranque-1125x2436.jpg" />
    <link rel="apple-touch-startup-image" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/arranque/arranque-1242x2688.jpg" />
    <link rel="apple-touch-startup-image" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" href="/arranque/arranque-828x1792.jpg" />
    <link rel="apple-touch-startup-image" media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" href="/arranque/arranque-750x1334.jpg" />
    <link rel="apple-touch-startup-image" media="(device-width: 414px) and (device-height: 736px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/arranque/arranque-1242x2208.jpg" />
    <link rel="apple-touch-startup-image" media="(device-width: 320px) and (device-height: 568px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" href="/arranque/arranque-640x1136.jpg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <title>Entrena con Método</title>
    <script>
      // Opener SOLO en arranque frío: si la app ya se abrió en esta sesión
      // (volver del centro de Aprendizaje, botón "atrás", recarga por
      // actualización), se entra directo sin animación — verla en cada
      // regreso aburre y se siente como espera. sessionStorage muere al
      // cerrar la app de verdad, así que el próximo arranque real sí la ve.
      try { if (sessionStorage.getItem('mt:booted')) document.documentElement.classList.add('warm-start'); } catch (e) {}
      // Visual nueva (en prueba): mismo filtro que VISUAL_V2 en src/v2.js.
      // Si cambias la lista allá, cámbiala aquí también.
      try {
        var crudo = localStorage.getItem('mt:name') || '';
        try { crudo = JSON.parse(crudo); } catch (e) {}
        var n = String(crudo || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/\s+/g, ' ').trim();
        if (['mauro moron'].indexOf(n) !== -1) document.documentElement.classList.add('splash-v2');
        // Visual nueva en este teléfono (su nombre está en la lista, o se abrió
        // con ?v2=1 para instalarla antes de entrar): el nombre de la app en
        // la pantalla de inicio es «EntrenaMétodo», y al instalarla abre con
        // ?v2=1 (manifest-v2.json), así la pantalla de entrada nueva sale
        // aunque el teléfono aún no sepa quién es.
        var v2url = /[?&]v2=1\b/.test(location.search);
        if (v2url) { try { localStorage.setItem('mt:v2', '1'); } catch (e) {} }
        if (v2url || document.documentElement.classList.contains('splash-v2') || localStorage.getItem('mt:v2') === '1') {
          document.documentElement.classList.add('marca-v2');
          var tt = document.querySelector('meta[name="apple-mobile-web-app-title"]');
          if (tt) tt.setAttribute('content', 'EntrenaMétodo');
          var mf = document.querySelector('link[rel="manifest"]');
          if (mf) mf.setAttribute('href', '/manifest-v2.json');
        }
        // La entrada sale SIEMPRE que la app se abre de verdad (cerrada y
        // vuelta a abrir). No sale en una recarga dentro de la misma sesión
        // (warm-start: volver de Aprendizaje, una actualización). Al volver
        // desde segundo plano (minimizada) sale si pasaron 2 h o más (main.jsx).
        var raiz = document.documentElement;
        // El tamaño de la PANTALLA (no de la vista): al abrir desde el ícono,
        // el iPhone agranda la vista un instante después; si el fondo se
        // midiera con la vista, «crecería» frente a los ojos.
        try {
          var lado = Math.max(screen.width || 0, screen.height || 0) || Math.max(innerWidth, innerHeight);
          raiz.style.setProperty('--pantalla', lado + 'px');
          raiz.style.setProperty('--alto-pantalla', (screen.height || innerHeight) + 'px');
        } catch (e) {}
        if (raiz.classList.contains('splash-v2') && !raiz.classList.contains('warm-start')) {
          raiz.classList.add('intro-completa');
          var tc = document.querySelector('meta[name="theme-color"]');
          if (tc) tc.setAttribute('content', '#F7F6F2');
        }
      } catch (e) {}
    </script>
    <style>
      /* CSS inline crítico — splash de marca mientras React carga. Todo es
         SVG+CSS inline (cero requests extra), así aparece al instante.
         Recrea el logo real: M blanca + anillo de progreso verde que se
         llena + punto blanco en la cabeza del anillo + destello sobre la M.
         Secuencia ~1.4s + fade; main.jsx retiene el splash ~1.6s (ritmo de
         app premium: se alcanza a leer la marca sin sentir espera). */
      /* NADA de recursos externos aquí: una hoja de estilos remota bloquea
         el primer pintado y deja la app en blanco si la red falla. La app ya
         trae Bebas empaquetada (@fontsource en main.jsx) y el splash dura lo
         suficiente para que llegue; hasta entonces se usa la de reserva. */
      html, body { margin: 0; padding: 0; background: #EDECE5; font-family: -apple-system, system-ui, sans-serif; }
      #splash {
        position: fixed; inset: 0;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        background: #0C0C0B;
        z-index: 9999;
        transition: opacity 0.3s ease-out;
      }
      #splash .logo { width: 148px; height: 148px; }
      /* Anillo: se llena de 0 → ~92% en 0.85s (dasharray = 2πr, r=210) */
      #splash .ring {
        stroke-dasharray: 1131.0;
        stroke-dashoffset: 1131.0;
        animation: ringfill 1.0s cubic-bezier(0.3, 0, 0.2, 1) 0.15s forwards;
      }
      @keyframes ringfill { to { stroke-dashoffset: 90.5; } }
      /* Punto blanco: gira acompañando la cabeza del anillo (~331° = 92%) */
      #splash .head {
        transform-origin: 256px 256px;
        transform: rotate(0deg);
        animation: headspin 1.0s cubic-bezier(0.3, 0, 0.2, 1) 0.15s forwards;
      }
      @keyframes headspin { to { transform: rotate(331deg); } }
      /* Destello: un segmento de luz recorre el trazo de la M una vez */
      #splash .shine {
        stroke-dasharray: 90 520;
        stroke-dashoffset: 90;
        opacity: 0;
        animation: shinerun 0.6s ease-in-out 0.75s forwards;
      }
      @keyframes shinerun {
        0%   { opacity: 0; stroke-dashoffset: 90; }
        15%  { opacity: 0.95; }
        85%  { opacity: 0.95; }
        100% { opacity: 0; stroke-dashoffset: -520; }
      }
      #splash .sub {
        margin-top: 20px;
        /* Tipo de la marca. La fuente web puede no haber cargado todavía en
           un arranque frío, así que se declara la pila completa. */
        font-family: 'Bebas Neue', 'Oswald', 'Haettenschweiler', 'Arial Narrow', sans-serif;
        font-size: 26px; letter-spacing: 0.06em; text-transform: uppercase;
        color: #FFFFFF; font-weight: 400; line-height: 1;
        opacity: 0;
        animation: subfade 0.5s ease-out 0.55s forwards;
      }
      @keyframes subfade { to { opacity: 1; } }
      /* Oculta el splash una vez que React montó */
      body.app-ready #splash { opacity: 0; pointer-events: none; }
      /* Arranque caliente (misma sesión): sin opener, directo a la app */
      html.warm-start #splash { display: none; }
      /* ── Apertura de la visual nueva ─────────────────────────────────────
         Sale siempre que la app se abre (cerrada y vuelta a abrir) y al
         volver a ella desde segundo plano tras 2 h o más (ver main.jsx).
         Para que NO se trabe: mientras la app carga solo se ven el fondo y el
         riel del anillo; la secuencia arranca (html.intro-anda) cuando la app
         ya está armada debajo. Rápida, como la de cualquier app:
           0.05–0.75 s  la línea circular de progreso, gris oscuro, como las
                        del Dash, con el puntito en la punta, da la vuelta
           0.10–0.70 s  «Entrena con / Método.» en dos líneas
           0.75–1.10 s  se rellena con el círculo blanco
           1.05–1.40 s  sale el asa: la kettlebell (sin cara ni brazos)
           2.00 s       el fondo se desvanece y aparece la app
         El fondo cubre TODA la pantalla del teléfono, también la franja de
         abajo (en el iPhone «inset: 0» se quedaba corto y se veía la app), y
         se mide con la pantalla, no con la vista: al abrir desde el ícono el
         iPhone agranda la vista un instante después y el fondo «crecía».
         El color del arranque (manifest.json, background_color) es el mismo
         crema: antes era blanco y se veía una franja blanca abajo. */
      @font-face { font-family: 'ECM Splash'; font-weight: 300 900; font-display: block;
        src: url('/fonts/figtree.woff2') format('woff2-variations'), url('/fonts/figtree.woff2') format('woff2'); }
      #splash2 { display: none; }
      html.splash-v2 #splash { display: none; }
      /* Entrada con el ÍCONO de la app (visual nueva), como la haría Apple:
           0.00–1.25 s  cuatro manchas de la marca nacen juntas en el centro
                        como gotas de tinta, giran en espiral hacia afuera, se
                        cruzan y quedan respirando cada una en su esquina
           0.42–1.17 s  un disco de cristal aparece en el centro
           0.62–1.42 s  el ícono sube desde abajo inclinado y se endereza
           1.12–1.82 s  una luz lo cruza; sale el punto amarillo con un brillo
           1.28–1.86 s  «Entrena con Método.» letra por letra, de desenfocada a
                        nítida, con el punto final en amarillo
           2.25 s       todo crece, se desenfoca y aparece la app */
      html.splash-v2 #splash2 { position: fixed; top: -60px; left: 0; right: 0; bottom: -200px; z-index: 9999; display: block;
        overflow: hidden; pointer-events: none; background: #F7F6F2; transition: opacity .6s cubic-bezier(.5,0,.75,0); }
      html.warm-start #splash2 { display: none !important; }
      html.warm-start.intro-repite #splash2 { display: block !important; }
      body.app-ready #splash2 { opacity: 0; }
      #splash2 .fondo { position: absolute; inset: 0; background: linear-gradient(180deg, #FFFFFF, #F1EFEA); }
      #splash2 .escena { position: absolute; left: 0; right: 0; top: 60px; height: 100vh; height: var(--alto-pantalla, 100lvh);
        transition: transform .6s cubic-bezier(.5,0,.75,0), filter .6s cubic-bezier(.5,0,.75,0); }
      body.app-ready #splash2 .escena { transform: scale(1.9); filter: blur(8px); }
      #splash2 .remolino { position: absolute; left: 50%; top: 46%; width: 0; height: 0; }
      #splash2 .m { position: absolute; width: 420px; height: 360px; margin: -180px 0 0 -210px; filter: blur(30px); opacity: 0; }
      #splash2 .m1 { background: radial-gradient(closest-side, rgba(60,123,214,.75), rgba(60,123,214,0)); border-radius: 48% 52% 44% 56% / 55% 42% 58% 45%; --x: -150px; --y: -300px; --s: 1.25; }
      #splash2 .m2 { background: radial-gradient(closest-side, rgba(242,201,76,.85), rgba(242,201,76,0)); border-radius: 56% 44% 52% 48% / 46% 56% 44% 54%; --x: 160px; --y: -280px; --s: 1.15; }
      #splash2 .m3 { background: radial-gradient(closest-side, rgba(70,150,90,.7), rgba(70,150,90,0)); border-radius: 44% 56% 58% 42% / 52% 48% 52% 48%; --x: -160px; --y: 330px; --s: 1.25; }
      #splash2 .m4 { background: radial-gradient(closest-side, rgba(238,132,52,.68), rgba(238,132,52,0)); border-radius: 52% 48% 46% 54% / 44% 56% 46% 54%; --x: 165px; --y: 300px; --s: 1.15; }
      #splash2 .velo { position: absolute; inset: 0; opacity: 0; background: radial-gradient(70% 45% at 50% 46%, rgba(255,255,255,.92), rgba(255,255,255,0) 70%); }
      #splash2 .disco { position: absolute; left: 50%; top: 46%; width: 176px; height: 176px; margin: -88px 0 0 -88px; border-radius: 50%;
        background: rgba(255,255,255,.42); -webkit-backdrop-filter: blur(22px) saturate(1.6); backdrop-filter: blur(22px) saturate(1.6);
        box-shadow: 0 30px 60px rgba(30,30,40,.14), inset 0 1px 0 rgba(255,255,255,.9), inset 0 0 0 1px rgba(255,255,255,.55);
        opacity: 0; transform: scale(.55); filter: blur(10px); }
      #splash2 .escena3d { position: absolute; left: 50%; top: 46%; width: 120px; height: 120px; margin: -60px 0 0 -60px; perspective: 500px; }
      #splash2 .marca { width: 120px; height: 120px; overflow: visible; opacity: 0; transform-origin: 50% 80%; transform: translateY(38px) rotateX(55deg) scale(.86); }
      #splash2 .brillo { transform: translateX(-260px) skewX(-18deg); }
      #splash2 .punto, #splash2 .halo { transform-box: fill-box; transform-origin: center; transform: scale(0); }
      #splash2 .halo { opacity: 0; }
      #splash2 .nombre { position: absolute; left: 0; right: 0; top: calc(46% + 118px); margin: 0; text-align: center;
        font-family: 'ECM Splash', -apple-system, system-ui, sans-serif; font-weight: 800; font-size: 25px;
        letter-spacing: -0.02em; color: #1D1D1F; white-space: nowrap; }
      #splash2 .nombre span { display: inline-block; opacity: 0; filter: blur(7px); transform: translateY(8px); }
      #splash2 .nombre .pto { color: #F2C94C; filter: none; transform: scale(0); }
      html.intro-anda #splash2 .remolino { animation: s2gira 2.6s cubic-bezier(.25,.6,.2,1) forwards; }
      html.intro-anda #splash2 .m { animation: s2sale 1.25s cubic-bezier(.2,.75,.15,1) forwards, s2respira 3.2s ease-in-out 1.1s infinite alternate; }
      html.intro-anda #splash2 .m2 { animation-delay: .07s, 1.17s; }
      html.intro-anda #splash2 .m3 { animation-delay: .14s, 1.24s; }
      html.intro-anda #splash2 .m4 { animation-delay: .21s, 1.31s; }
      html.intro-anda #splash2 .velo { animation: s2aparece .7s ease-out .55s forwards; }
      html.intro-anda #splash2 .disco { animation: s2disco .75s cubic-bezier(.2,1.3,.3,1) .42s forwards; }
      html.intro-anda #splash2 .marca { animation: s2entra .8s cubic-bezier(.16,1,.3,1) .62s forwards; }
      html.intro-anda #splash2 .brillo { animation: s2barre .7s cubic-bezier(.4,0,.2,1) 1.12s forwards; }
      html.intro-anda #splash2 .punto { animation: s2pop .5s cubic-bezier(.3,1.9,.5,1) 1.18s forwards; }
      html.intro-anda #splash2 .halo { animation: s2halo .9s ease-out 1.2s forwards; }
      html.intro-anda #splash2 .nombre span { animation: s2letra .5s cubic-bezier(.2,.8,.2,1) forwards; }
      html.intro-anda #splash2 .nombre .pto { animation: s2pop2 .4s cubic-bezier(.3,1.9,.5,1) 1.86s forwards; }
      @keyframes s2gira { from { transform: rotate(-160deg); } to { transform: rotate(0deg); } }
      @keyframes s2sale { 0% { opacity: 0; transform: translate(0, 0) scale(.12); } 18% { opacity: 1; } 55% { transform: translate(calc(var(--x) * .7), calc(var(--y) * .7)) scale(calc(var(--s) * 1.08)); } 100% { opacity: 1; transform: translate(var(--x), var(--y)) scale(var(--s)); } }
      @keyframes s2respira { from { opacity: 1; transform: translate(var(--x), var(--y)) scale(var(--s)); } to { opacity: 1; transform: translate(var(--x), var(--y)) scale(calc(var(--s) * 1.08)); } }
      @keyframes s2aparece { to { opacity: 1; } }
      @keyframes s2disco { to { opacity: 1; transform: scale(1); filter: blur(0); } }
      @keyframes s2entra { 60% { opacity: 1; } to { opacity: 1; transform: none; } }
      @keyframes s2barre { to { transform: translateX(560px) skewX(-18deg); } }
      @keyframes s2pop { to { transform: scale(1); } }
      @keyframes s2halo { 0% { transform: scale(.6); opacity: .7; } 100% { transform: scale(2.6); opacity: 0; } }
      @keyframes s2letra { to { opacity: 1; filter: blur(0); transform: none; } }
      @keyframes s2pop2 { to { opacity: 1; transform: scale(1); } }
      @media (prefers-reduced-motion: reduce) {
        #splash2 * { animation-duration: 0.01s !important; animation-delay: 0s !important; transition: none !important; }
      }
      @media (prefers-reduced-motion: reduce) {
        #splash .ring { animation-duration: 0.01s; }
        #splash .head { animation-duration: 0.01s; }
        #splash .shine, #splash .sub { animation: none; opacity: 0; }
        #splash .sub { opacity: 1; }
      }
    </style>
  </head>
  <body>
    <div id="splash">
      <svg class="logo" viewBox="0 0 512 512" fill="none" aria-label="Entrena con Método">
        <defs>
          <linearGradient id="sp-ring" x1="140" y1="60" x2="420" y2="452" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#3A4126"/>
            <stop offset="0.55" stop-color="#8A9558"/>
            <stop offset="1" stop-color="#B9D454"/>
          </linearGradient>
        </defs>
        <!-- riel tenue del anillo -->
        <circle cx="256" cy="256" r="180" stroke="#232322" stroke-width="16"/>
        <!-- anillo de progreso que se llena (arranca arriba: rotado -90°) -->
        <circle class="ring" cx="256" cy="256" r="180" stroke="url(#sp-ring)"
                stroke-width="16" stroke-linecap="round" transform="rotate(-90 256 256)"/>
        <!-- punto blanco en la cabeza del anillo -->
        <g class="head"><circle cx="256" cy="76" r="17" fill="#F5F3EC"/></g>
        <!-- la M del logo -->
        <polyline points="194,305 194,196 267,282 314,203" stroke="#F5F3EC"
                  stroke-width="24" stroke-linecap="square" stroke-linejoin="miter"/>
        <!-- destello que recorre la M -->
        <polyline class="shine" points="194,305 194,196 267,282 314,203" stroke="#FFFFFF"
                  stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <div class="sub">Entrena con Método</div>
    </div>
    <div id="splash2" aria-label="Entrena con Método">
      <div class="fondo"></div>
      <div class="escena">
        <div class="remolino"><div class="m m1"></div><div class="m m2"></div><div class="m m3"></div><div class="m m4"></div></div>
        <div class="velo"></div>
        <div class="disco"></div>
        <!-- El ícono de la app: la línea de la gráfica es el cuerpo de la
             kettlebell, con el asa encima y el punto amarillo en la punta. -->
        <div class="escena3d"><svg class="marca" viewBox="0 0 512 512" fill="none" aria-hidden="true"><defs>
          <linearGradient id="s2t" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3B3A37"/><stop offset="1" stop-color="#1F1E1C"/></linearGradient>
          <linearGradient id="s2l" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".6"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
          <filter id="s2s" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#000" flood-opacity=".2"/></filter>
          <mask id="s2m"><g transform="translate(256 262) scale(.9) translate(-256 -248)" fill="none" stroke="#fff" stroke-width="40" stroke-linecap="round"><path d="M128 162 C96 72 160 18 256 18 C352 18 416 72 384 162"/><path d="M256 164 A136 136 0 1 1 120 300"/></g></mask></defs>
          <g transform="translate(256 262) scale(.9) translate(-256 -248)" filter="url(#s2s)" fill="none" stroke="url(#s2t)" stroke-width="40" stroke-linecap="round">
            <path d="M128 162 C96 72 160 18 256 18 C352 18 416 72 384 162"/><path d="M256 164 A136 136 0 1 1 120 300"/></g>
          <g mask="url(#s2m)"><rect class="brillo" x="0" y="0" width="160" height="512" fill="url(#s2l)"/></g>
          <g transform="translate(256 262) scale(.9) translate(-256 -248)">
            <circle class="halo" cx="120" cy="300" r="28.8" fill="#F2C94C"/>

      <script>
        // La secuencia espera a que la app esté armada (main.jsx la arranca);
        // mientras, el reloj de las animaciones SVG queda en pausa. Si la app
        // tarda demasiado, arranca sola a los 2,5 s.
        (function () {
          var sv = document.querySelector('#splash2 .marca');
          try { sv.pauseAnimations(); } catch (e) {}
          window.__empezarIntro = function () {
            var r = document.documentElement;
            if (!r.classList.contains('intro-completa')) return 0;
            if (window.__introDesde) return window.__introDesde;
            var svg = document.querySelector('#splash2 .marca');
            try { svg.setCurrentTime(0); svg.unpauseAnimations(); } catch (e) {}
            r.classList.add('intro-anda');
            window.__introDesde = performance.now();
            return window.__introDesde;
          };
          setTimeout(function () { window.__empezarIntro(); }, 2500);
        })();
      </script>
    </div>
