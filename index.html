<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <!-- Crema, no grafito: la app es edge-to-edge sin barra negra superior,
         así que el área de la barra de estado debe fundirse con el fondo. -->
    <meta name="theme-color" content="#F1F0EA" />

    <!-- Meta tags PWA: cuando el usuario hace "Agregar a Inicio" en iOS,
         la app abre en modo "standalone" (sin barra de URL de Safari, sin
         barra de asistente de formularios con chevrons, sin gestos de
         navegación). Se siente como una app nativa. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Método" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />

    <!-- PWA instalable: manifest + iconos. En Android da ícono real, splash
         y modo standalone; en iOS el apple-touch-icon cubre "Agregar a Inicio". -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <title>Entrena con Método</title>
    <script>
      // Opener SOLO en arranque frío: si la app ya se abrió en esta sesión
      // (volver del centro de Aprendizaje, botón "atrás", recarga por
      // actualización), se entra directo sin animación — verla en cada
      // regreso aburre y se siente como espera. sessionStorage muere al
      // cerrar la app de verdad, así que el próximo arranque real sí la ve.
      try { if (sessionStorage.getItem('mt:booted')) document.documentElement.classList.add('warm-start'); } catch (e) {}
      // Visual nueva (en prueba): mismo filtro que VISUAL_V2 en src/v2.js.
      // Si cambias la lista allá, cámbiala aquí también.
      try {
        var crudo = localStorage.getItem('mt:name') || '';
        try { crudo = JSON.parse(crudo); } catch (e) {}
        var n = String(crudo || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/\s+/g, ' ').trim();
        if (['mauro moron'].indexOf(n) !== -1) document.documentElement.classList.add('splash-v2');
        // La entrada nueva es negra: la barra del teléfono también, mientras dura.
        if (document.documentElement.classList.contains('splash-v2') && !document.documentElement.classList.contains('warm-start')) {
          var tc = document.querySelector('meta[name="theme-color"]'); if (tc) tc.setAttribute('content', '#0C0C0B');
        }
      } catch (e) {}
    </script>
    <style>
      /* CSS inline crítico — splash de marca mientras React carga. Todo es
         SVG+CSS inline (cero requests extra), así aparece al instante.
         Recrea el logo real: M blanca + anillo de progreso verde que se
         llena + punto blanco en la cabeza del anillo + destello sobre la M.
         Secuencia ~1.4s + fade; main.jsx retiene el splash ~1.6s (ritmo de
         app premium: se alcanza a leer la marca sin sentir espera). */
      /* NADA de recursos externos aquí: una hoja de estilos remota bloquea
         el primer pintado y deja la app en blanco si la red falla. La app ya
         trae Bebas empaquetada (@fontsource en main.jsx) y el splash dura lo
         suficiente para que llegue; hasta entonces se usa la de reserva. */
      html, body { margin: 0; padding: 0; background: #EDECE5; font-family: -apple-system, system-ui, sans-serif; }
      #splash {
        position: fixed; inset: 0;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        background: #0C0C0B;
        z-index: 9999;
        transition: opacity 0.3s ease-out;
      }
      #splash .logo { width: 148px; height: 148px; }
      /* Anillo: se llena de 0 → ~92% en 0.85s (dasharray = 2πr, r=210) */
      #splash .ring {
        stroke-dasharray: 1131.0;
        stroke-dashoffset: 1131.0;
        animation: ringfill 1.0s cubic-bezier(0.3, 0, 0.2, 1) 0.15s forwards;
      }
      @keyframes ringfill { to { stroke-dashoffset: 90.5; } }
      /* Punto blanco: gira acompañando la cabeza del anillo (~331° = 92%) */
      #splash .head {
        transform-origin: 256px 256px;
        transform: rotate(0deg);
        animation: headspin 1.0s cubic-bezier(0.3, 0, 0.2, 1) 0.15s forwards;
      }
      @keyframes headspin { to { transform: rotate(331deg); } }
      /* Destello: un segmento de luz recorre el trazo de la M una vez */
      #splash .shine {
        stroke-dasharray: 90 520;
        stroke-dashoffset: 90;
        opacity: 0;
        animation: shinerun 0.6s ease-in-out 0.75s forwards;
      }
      @keyframes shinerun {
        0%   { opacity: 0; stroke-dashoffset: 90; }
        15%  { opacity: 0.95; }
        85%  { opacity: 0.95; }
        100% { opacity: 0; stroke-dashoffset: -520; }
      }
      #splash .sub {
        margin-top: 20px;
        /* Tipo de la marca. La fuente web puede no haber cargado todavía en
           un arranque frío, así que se declara la pila completa. */
        font-family: 'Bebas Neue', 'Oswald', 'Haettenschweiler', 'Arial Narrow', sans-serif;
        font-size: 26px; letter-spacing: 0.06em; text-transform: uppercase;
        color: #FFFFFF; font-weight: 400; line-height: 1;
        opacity: 0;
        animation: subfade 0.5s ease-out 0.55s forwards;
      }
      @keyframes subfade { to { opacity: 1; } }
      /* Oculta el splash una vez que React montó */
      body.app-ready #splash { opacity: 0; pointer-events: none; }
      /* Arranque caliente (misma sesión): sin opener, directo a la app */
      html.warm-start #splash { display: none; }
      /* ── Apertura de la visual nueva · «Las palabras» ───────────────────
         Fondo negro y letra enorme, una frase por golpe, cada una en el
         color de su sección (el lenguaje de las campañas de Nike: dice qué
         es la app sin explicarla):
           0.15 s  ENTRENA.        blanco
           0.70 s  COME BIEN.      verde
           1.25 s  APRENDE.        naranja
           1.80 s  CON MÉTODO.     blanco, y abajo se dibuja el anillo con la M
         Se queda quieto hasta que la app está lista (mínimo 2,9 s desde que
         se toca el ícono, ver main.jsx) y se desvanece. */
      @font-face { font-family: 'ECM Splash'; font-weight: 300 900; font-display: block;
        src: url('/fonts/figtree.woff2') format('woff2-variations'), url('/fonts/figtree.woff2') format('woff2'); }
      #splash2 { display: none; }
      html.splash-v2 #splash { display: none; }
      html.splash-v2 #splash2 {
        position: fixed; inset: 0; z-index: 9999; display: block; overflow: hidden; background: #0C0C0B;
        transition: opacity 0.45s ease-out;
      }
      body.app-ready #splash2 { opacity: 0; pointer-events: none; }
      html.warm-start #splash2 { display: none !important; }
      #splash2 .w { position: absolute; left: 24px; right: 16px; top: 50%; margin: 0;
        font-family: 'ECM Splash', -apple-system, system-ui, sans-serif; font-weight: 900;
        font-size: min(17.5vw, 96px); line-height: 0.94; letter-spacing: -0.035em; color: #FFFFFF;
        opacity: 0; transform: translateY(-38%) scale(1.06); }
      #splash2 .w1 { animation: s2entra .2s cubic-bezier(.2,.8,.2,1) .15s forwards, s2sale .1s ease-in .62s forwards; }
      #splash2 .w2 { color: #5BB273; animation: s2entra .2s cubic-bezier(.2,.8,.2,1) .70s forwards, s2sale .1s ease-in 1.17s forwards; }
      #splash2 .w3 { color: #F2964A; animation: s2entra .2s cubic-bezier(.2,.8,.2,1) 1.25s forwards, s2sale .1s ease-in 1.72s forwards; }
      #splash2 .w4 { animation: s2entra .2s cubic-bezier(.2,.8,.2,1) 1.80s forwards; }
      @keyframes s2entra { to { opacity: 1; transform: translateY(-50%) scale(1); } }
      @keyframes s2sale { from { opacity: 1; transform: translateY(-50%) scale(1); } to { opacity: 0; transform: translateY(-56%) scale(0.98); } }
      #splash2 .anillo { position: absolute; left: 24px; bottom: calc(44px + env(safe-area-inset-bottom, 0px)); width: 52px; height: 52px; overflow: visible;
        opacity: 0; animation: s2in .25s ease-out 1.9s forwards; }
      #splash2 .anillo .arco { stroke-dasharray: 100 100; stroke-dashoffset: 100; animation: s2traza .6s cubic-bezier(.3,0,.2,1) 1.95s forwards; }
      #splash2 .anillo .eme { opacity: 0; animation: s2in .3s ease-out 2.35s forwards; }
      #splash2 .nombre { position: absolute; left: 88px; bottom: calc(52px + env(safe-area-inset-bottom, 0px));
        font-family: 'ECM Splash', -apple-system, system-ui, sans-serif; font-weight: 800; font-size: 13px;
        letter-spacing: 0.16em; color: rgba(255,255,255,0.62); opacity: 0; animation: s2in .4s ease-out 2.4s forwards; }
      @keyframes s2traza { to { stroke-dashoffset: 0; } }
      @keyframes s2in { to { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) {
        #splash2 .w1, #splash2 .w2, #splash2 .w3 { display: none; }
        #splash2 .w4, #splash2 .anillo, #splash2 .anillo .arco, #splash2 .anillo .eme, #splash2 .nombre { animation-duration: 0.01s !important; animation-delay: 0s !important; }
      }
      @media (prefers-reduced-motion: reduce) {
        #splash .ring { animation-duration: 0.01s; }
        #splash .head { animation-duration: 0.01s; }
        #splash .shine, #splash .sub { animation: none; opacity: 0; }
        #splash .sub { opacity: 1; }
      }
    </style>
  </head>
  <body>
    <div id="splash">
      <svg class="logo" viewBox="0 0 512 512" fill="none" aria-label="Entrena con Método">
        <defs>
          <linearGradient id="sp-ring" x1="140" y1="60" x2="420" y2="452" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#3A4126"/>
            <stop offset="0.55" stop-color="#8A9558"/>
            <stop offset="1" stop-color="#B9D454"/>
          </linearGradient>
        </defs>
        <!-- riel tenue del anillo -->
        <circle cx="256" cy="256" r="180" stroke="#232322" stroke-width="16"/>
        <!-- anillo de progreso que se llena (arranca arriba: rotado -90°) -->
        <circle class="ring" cx="256" cy="256" r="180" stroke="url(#sp-ring)"
                stroke-width="16" stroke-linecap="round" transform="rotate(-90 256 256)"/>
        <!-- punto blanco en la cabeza del anillo -->
        <g class="head"><circle cx="256" cy="76" r="17" fill="#F5F3EC"/></g>
        <!-- la M del logo -->
        <polyline points="194,305 194,196 267,282 314,203" stroke="#F5F3EC"
                  stroke-width="24" stroke-linecap="square" stroke-linejoin="miter"/>
        <!-- destello que recorre la M -->
        <polyline class="shine" points="194,305 194,196 267,282 314,203" stroke="#FFFFFF"
                  stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <div class="sub">Entrena con Método</div>
    </div>
    <div id="splash2" aria-label="Entrena con Método">
      <p class="w w1">ENTRENA.</p>
      <p class="w w2">COME<br>BIEN.</p>
      <p class="w w3">APRENDE.</p>
      <p class="w w4">CON<br>MÉTODO.</p>
      <svg class="anillo" viewBox="0 0 512 512" fill="none" aria-hidden="true">
        <circle cx="256" cy="256" r="172" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="44"/>
        <path class="arco" d="M256 84 A172 172 0 1 1 107.04 342" pathLength="100" stroke="#4FA463" stroke-width="44" stroke-linecap="round"/>
        <polyline class="eme" points="194,305 194,196 267,282 314,203" stroke="#FFFFFF" stroke-width="30" stroke-linecap="square" stroke-linejoin="miter"/>
      </svg>
      <div class="nombre">ENTRENA CON MÉTODO</div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
